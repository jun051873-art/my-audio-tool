<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="專屬空間">
    <title>Salon V299 - 專屬1號守則終極鎖死</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1d1d1f; --gold: #D4AF37; --luxe-border: rgba(212, 175, 55, 0.4); --glass: rgba(255, 255, 255, 0.45); --round-pill: 40px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #fff; position: fixed; }
        body { font-family: 'Noto Sans TC', sans-serif; color: var(--primary); display: flex; flex-direction: column; }

        .glow-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(to right, #1d1d1f 20%, #D4AF37 40%, #D4AF37 60%, #1d1d1f 80%); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }

        .fab { position: fixed; bottom: 140px; right: 40px; width: 85px; height: 85px; background: #fff; border: 2.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2.5rem; z-index: 3000; animation: breathe 3s ease-in-out infinite; box-shadow: 0 15px 35px rgba(212,175,55,0.25); }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

        .luxe-btn { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--luxe-border); border-radius: var(--round-pill); padding: 18px 32px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem; height: 65px; transition: 0.3s; }
        .luxe-btn:active { transform: scale(0.95); }

        .header { padding: 65px 45px 25px; display: flex; justify-content: space-between; align-items: flex-end; background: rgba(255,255,255,0.85); backdrop-filter: blur(35px); z-index: 1000; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 220px; }

        /* 月曆鋼鐵協議 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin: 15px 45px; border-radius: 40px; overflow: hidden; background: #f2f2f7; border: 0.3px solid var(--gold); }
        .cal-day { background: #fff; min-height: 135px; padding: 20px; cursor: pointer; border: 0.3px solid rgba(212, 175, 55, 0.15); font-size: 1.5rem; position: relative; }
        .cal-day.today-highlight { background: rgba(212, 175, 55, 0.08) !important; }

        /* 顧客雙排藥丸 */
        .client-grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; padding: 25px 45px; }
        .client-card { border-radius: 35px; padding: 30px; background: #fff; border: 0.8px solid var(--luxe-border); border-left: 15px solid var(--sty-color, #eee); box-shadow: 0 10px 35px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 15px; }
        .history-pill { font-size: 1rem; background: #f8f8f8; padding: 6px 15px; border-radius: 18px; color:#555; border: 0.5px solid var(--gold); display: inline-flex; align-items: center; gap: 8px; }

        /* 智慧建議框樣式 (對齊照片) */
        .suggest-box { position: absolute; width: 100%; background: #fff; border-radius: 30px; z-index: 5000; display: none; border: 2px solid var(--gold); max-height: 280px; overflow-y: auto; margin-top: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        .suggest-item { padding: 22px 30px; border-bottom: 0.5px solid #eee; font-weight: 900; font-size: 1.4rem; cursor: pointer; color: var(--primary); text-align: center; }

        /* 日看板時空並排與變淡 */
        .lane-container { display: flex; overflow-x: auto; padding: 35px 45px; gap: 30px; flex: 1; align-items: flex-start; }
        .lane { flex: 1; min-width: 380px; display: flex; flex-direction: column; gap: 20px; }
        .time-row-space { min-height: 240px; display: flex; flex-direction: row; gap: 12px; align-items: stretch; }
        .apt-card { padding: 30px; background: #fff; border-radius: 40px; border: 1px solid var(--luxe-border); border-left: 15px solid var(--c); position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; transition: 0.4s; }
        .apt-card.completed { opacity: 0.3 !important; background: #f9f9fb !important; filter: grayscale(1); }

        .nav { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 750px; height: 105px; background: rgba(255,255,255,0.92); backdrop-filter: blur(40px); display: flex; justify-content: space-around; align-items: center; border-radius: 50px; border: 1px solid var(--luxe-border); z-index: 2000; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; font-size: 1.6rem; }
        .nav-item.active { color: var(--gold); transform: scale(1.1); }
        
        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: flex; flex-direction: column; }
        .swal-pill { border-radius: 45px !important; padding: 40px !important; border: 1px solid var(--gold) !important; }
        .tag-chip { display: inline-block; padding: 15px 28px; border-radius: 30px; border: 1px solid var(--gold); margin: 8px; font-weight: 900; font-size: 1.2rem; cursor: pointer; background: #fff; transition: 0.3s; }
        .tag-chip.selected { background: linear-gradient(135deg, var(--gold), #f3d060); color: #fff; border-color: var(--gold); }
        /* 五彩支付標籤樣式 [cite: 2026-02-28] */
.tag-group {
    display: flex; gap: 6px; justify-content: center; margin-top: 10px; margin-bottom: 5px;
}
.tag-pill {
    font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 10px;
    background: #f0f0f0; color: #aaa; cursor: pointer; transition: 0.3s;
    border: 1px solid #eee;
}
/* 啟動後的專屬顏色 [cite: 2026-02-28] */
.tag-pill.active-L { background: #06C755; color: #fff; border-color: #06C755; } /* LinePay 綠 */
.tag-pill.active-J { background: #ED1C24; color: #fff; border-color: #ED1C24; } /* 街口紅 */
.tag-pill.active-C { background: #8B4513; color: #fff; border-color: #8B4513; } /* 現金棕 */
.tag-pill.active-P { background: #007AFF; color: #fff; border-color: #007AFF; } /* 支付藍 */
.tag-pill.active-S { background: #FFCC00; color: #000; border-color: #FFCC00; } /* 販賣黃 */
   /* 側邊導航條樣式 */
    .side-nav {
        position: fixed; right: 10px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 5px; z-index: 4000;
        background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
        padding: 10px 5px; border-radius: 15px; border: 0.5px solid var(--luxe-border);
    }
    .side-nav-item {
        font-size: 0.8rem; font-weight: 900; color: var(--gold); cursor: pointer;
        width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    }
   </style>
</head>
<body>

<div id="pg-res" class="page active">
    <div class="header"><div class="glow-title">專屬空間</div><div style="display:flex; gap:20px; align-items:center;"><div class="luxe-btn" onclick="goToday()">今天</div><input type="month" id="m-picker" onchange="initMonth()" class="luxe-btn" style="width: 240px; background:#f2f2f7;"></div></div>
    <div class="calendar-header" style="display:grid; grid-template-columns: repeat(7, 1fr); margin: 25px 45px 0; text-align: center; font-size: 1.1rem; font-weight: 900; color: #aaa;"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="content-scroll"><div id="cal-grid" class="calendar-grid"></div></div>
</div>

<div id="pg-cli" class="page">
    <div class="header">
        <div style="font-size: 2.6rem; font-weight: 900;">顧客</div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div style="position:relative;">
                <div class="luxe-btn" onclick="popCliSearch()"><i class="fas fa-search"></i></div>
                <div id="cli-sw-box" class="suggest-box" style="width:350px; right:0;"></div>
            </div>
            <select id="cli-f-sty" class="luxe-btn" onchange="renderCli()"></select>
            <div class="luxe-btn" onclick="addCliTrig()" style="font-size:2.2rem; padding:12px 35px;">+</div>
        </div>
    </div>
    <div class="content-scroll"><div class="client-grid-container" id="cli-list"></div></div>
    <div class="side-nav" id="cli-side-nav"></div>
</div>

<div id="pg-set" class="page">
    <div class="header"><div style="font-size: 2.6rem; font-weight: 900;">設定</div></div>
    <div class="content-scroll" style="padding:0 45px;">
        <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888; font-size:1.3rem;">1. 排休連選與顏色</p><div style="display:flex; gap:25px;"><div class="luxe-btn" style="flex:1" onclick="pickOffMulti()"><i class="fas fa-calendar-check" style="margin-right:15px;"></i>選擇日期</div><input type="color" id="off-c" onchange="store.offColor=this.value;saveS();initMonth();" style="width:75px;height:75px;border:none;background:none;cursor:pointer;"></div><div id="off-tags" style="margin-top:25px; display:flex; flex-wrap:wrap; gap:12px;"></div></div>
        <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888; font-size:1.3rem;">2. 人員管理 (更名/刪除)</p><div id="s-sty-list"></div><div class="luxe-btn" style="width:100%; margin-top:25px;" onclick="addStyTrig()">+ 新增人員</div></div>
        <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888; font-size:1.3rem;">3. 服務項目管理</p><div id="s-tag-list" style="display:flex; flex-wrap:wrap;"></div><div class="luxe-btn" style="width:100%; margin-top:25px;" onclick="addTagTrig()">+ 新增項目</div></div>
        <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888; font-size:1.3rem;">4. 資料備份與恢復</p><div style="display:flex; gap:25px;"><div class="luxe-btn" style="flex:1" onclick="exportToFile()">下載存檔</div><div class="luxe-btn" style="flex:1" onclick="document.getElementById('file-in').click()">讀取存檔</div></div><input type="file" id="file-in" style="display:none" onchange="handleFile(this)"></div>
    </div>
</div>

<div id="pg-day" class="page">
    <div class="header"><div style="display:flex; align-items:center; gap:25px;"><i class="fas fa-chevron-left luxe-btn" style="border:none;" onclick="showP('pg-res')"></i><i class="fas fa-chevron-left luxe-btn" onclick="shiftDay(-1)"></i><div id="day-title" style="font-weight:900; font-size:2rem;"></div><i class="fas fa-chevron-right luxe-btn" onclick="shiftDay(1)"></i></div><div class="luxe-btn" onclick="goToday()">今天</div></div>
    <div class="lane-container" id="day-lanes"></div>
</div>

<button class="fab" onclick="popBooking()"><i class="fas fa-plus"></i></button>

<div class="nav">
    <div onclick="showP('pg-res')" id="n-res" class="nav-item active"><i class="fas fa-calendar-alt"></i><br><span style="font-size:1rem; font-weight:900;">預約表</span></div>
    <div onclick="showP('pg-cli')" id="n-cli" class="nav-item"><i class="fas fa-user-circle"></i><br><span style="font-size:1rem; font-weight:900;">顧客</span></div>
    <div onclick="showP('pg-set')" id="n-set" class="nav-item"><i class="fas fa-sliders-h"></i><br><span style="font-size:1rem; font-weight:900;">設定</span></div>
</div>

<script>
    let curD = new Date();
    let tempTags = [];
    let cliKw = "";
    let store = JSON.parse(localStorage.getItem('SALON_MASTER_FINAL_LOCK_V299')) || {
        offColor: "#e5e5ea", stylists: [{id: 1, name: 'Tonny', color: '#1d1d1f'}, {id: 2, name: 'Apple', color: '#D4AF37'}],
        tags: [{id: 1, name: '剪髮'}, {id: 2, name: '洗髮'}], appointments: [], clients: [], offDays: []
    };

function saveS() {
        // 1. 本地儲存：確保手機離線也能看到資料
        const dataString = JSON.stringify(store);
        localStorage.setItem('SALON_MASTER_FINAL_LOCK_V299', dataString);

   // 2. 鋼鐵雲端同步：請確保網址完全符合最新部署的網址
        fetch('https://script.google.com/macros/s/AKfycbzvXyjiv0AE9vbjjwe1UypHqmARboub8UKuteErV87GS4KYvMRfpbrBVm5ENwvobMI/exec', {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: dataString
        })
        .then(() => console.log("✅ 雲端自動同步成功"))
        .catch(err => console.warn("⚠️ 雲端同步暫時失敗，已先存於手機:", err));
    }
    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id.includes('res')) { document.getElementById('n-res').classList.add('active'); initMonth(); }
        else if(id==='pg-cli') { document.getElementById('n-cli').classList.add('active'); renderCli(); }
        else if(id==='pg-set') { document.getElementById('n-set').classList.add('active'); renderSet(); }
        else if(id==='pg-day') { renderDay(curD.toLocaleDateString('sv')); }
    }

    function goToday() { curD = new Date(); initMonth(); renderDay(curD.toLocaleDateString('sv')); showP('pg-day'); }
    function shiftDay(v) { curD.setDate(curD.getDate() + v); renderDay(curD.toLocaleDateString('sv')); }

    // --- 排休連選鋼鐵修復 ---
    async function pickOffMulti() {
        await Swal.fire({
            title: '連選排休', customClass: { popup: 'swal-pill' },
            html: `<div class="calendar-header" style="display:grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 1.1rem; font-weight: 900; color: #aaa; margin-bottom:15px;"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div style="max-height:55vh; overflow-y:auto;"><div id="sw-cal" style="display:grid; grid-template-columns: repeat(7, 1fr); border-radius: 30px; overflow: hidden; background: #f2f2f7; border: 1px solid rgba(0,0,0,0.05);"></div></div>`,
            didOpen: () => {
                const g = document.getElementById('sw-cal'); const y = new Date().getFullYear(), m = new Date().getMonth();
                const days = new Date(y, m+1, 0).getDate(); let sDay = new Date(y, m, 1).getDay(); sDay = sDay === 0 ? 6 : sDay - 1;
                for(let i=0; i<sDay; i++) g.appendChild(document.createElement('div'));
                for(let d=1; d<=days; d++) {
                    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const el = document.createElement('div'); el.style.cssText="background:#fff; min-height:85px; padding:15px; cursor:pointer; border:0.5px solid #eee; font-size:1.3rem;"; el.innerText=d;
                    if(store.offDays.includes(ds)) el.style.background = store.offColor;
                    el.onclick = () => {
                        const i = store.offDays.indexOf(ds);
                        if(i>-1) { store.offDays.splice(i,1); el.style.background='#fff'; }
                        else { store.offDays.push(ds); el.style.background=store.offColor; }
                        saveS(); initMonth(); renderSet();
                    }; g.appendChild(el);
                }
            }
        });
    }

    // --- 智慧建議引擎 ---
    function searchStored(el, boxId) {
        const val = el.value.trim(); const box = document.getElementById(boxId);
        if(!val) { box.style.display='none'; return; }
        const ms = store.clients.filter(c => c.n.includes(val) || c.p.includes(val));
        if(ms.length) { box.style.display='block'; box.innerHTML = ms.map(m => `<div class="suggest-item" onclick="pickSug('${m.n}', '${m.p}', '${m.lastSty}', '${boxId}')">${m.n} (${m.p})</div>`).join(''); } else box.style.display='none';
    }

    function pickSug(n, p, s, boxId) {
        if(boxId === 'sw-box' || boxId === 'cli-sw-box') {
         cliKw = ""; // 重點 1：清空關鍵字，顯示所有人才能滑動
            renderCli(""); // 重點 2：強制畫出所有人的卡片
            Swal.close();

            // --- 賈伯斯風格：自動平滑捲動並閃爍對焦 ---
            setTimeout(() => {
                // 用 ID 找到那張卡片
                const target = document.getElementById(`cli-card-${n}`);
                if(target) {
                    // 1. 平滑捲動到畫面中央
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    // 2. 視覺效果：金色閃爍、稍微放大、浮到最上層
                    target.style.transition = "0.6s cubic-bezier(0.23, 1, 0.32, 1)";
                    target.style.boxShadow = "0 0 60px var(--gold)";
                    target.style.transform = "scale(1.06)";
                    target.style.zIndex = "5000";
                    
                    // 2秒後自動恢復原狀
                    setTimeout(() => {
                        target.style.boxShadow = "0 10px 35px rgba(0,0,0,0.04)";
                        target.style.transform = "scale(1)";
                        target.style.zIndex = "1";
                    }, 2000);
                }
            }, 400); // 稍微延遲 0.4 秒，等卡片全部畫好再滑動
        } else {
            // 預約視窗內的填入邏輯保持不變
            document.getElementById('pop-n').value = n; 
            document.getElementById('pop-p').value = p; 
            document.getElementById('pop-s').value = s; 
            document.getElementById('pop-box').style.display = 'none'; 
        }
    }

    async function popCliSearch() {
        const { value: res } = await Swal.fire({
            title: '快速搜尋', customClass: { popup: 'swal-pill' },
            html: `<div style="position:relative;"><input id="sw-search" class="luxe-btn" style="width:100%; font-size:1.6rem; text-align:center;" placeholder="打個姓氏或電話" oninput="searchStored(this, 'sw-box')"><div id="sw-box" class="suggest-box" style="display:none; position:relative; top:10px;"></div></div>`,
            showCancelButton: true, showConfirmButton: false, cancelButtonText: '清除'
        });
        if(res === undefined) { cliKw = ""; renderCli(); }
    }

    // --- 靈魂渲染協議 ---
  function renderCli(kw = "") {
        const area = document.getElementById('cli-list');
        const fStyId = document.getElementById('cli-f-sty').value;
        cliKw = kw; 

        const filtered = store.clients.filter(c => {
            const matchKw = (c.n || "").includes(kw) || (c.p || "").includes(kw);
            const matchSty = fStyId === "" || String(c.lastSty) === String(fStyId);
            return matchKw && matchSty;
        });

        area.innerHTML = filtered.map(c => {
            // 精準抓取該客人的完成紀錄
            const history = store.appointments
                .filter(a => (a.name === c.n || a.p === c.p) && a.done)
                .sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 3);

            const sty = store.stylists.find(s => String(s.id) === String(c.lastSty));
            const styC = sty?.color || '#D4AF37';

            return `
            <div id="cli-card-${c.n}" class="apt-card" style="margin-bottom:25px; border-left:12px solid ${styC}; background:#fff; padding:25px; border-radius:35px; position:relative;">
                <div style="position:absolute; right:20px; top:20px; color:${styC}; border:1px solid ${styC}; padding:4px 12px; border-radius:15px; font-size:0.8rem; font-weight:900;">${sty?.name || '未指定'}</div>
                <div style="font-weight:900; font-size:1.8rem; margin-bottom:5px;">${c.n}</div>
                <div style="font-size:1.1rem; color:${styC}; font-weight:700; margin-bottom:12px;">「${c.note || '新顧客'}」</div>
                <div style="background:#f9f9fb; padding:15px; border-radius:20px; font-size:0.9rem;">
                    <div style="color:#bbb; font-weight:900; font-size:0.7rem; margin-bottom:8px;">最近消費紀錄</div>
                    ${history.length ? history.map(h => `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${h.date}</span><span style="color:${styC}">${(h.tags || []).join('+')}</span></div>`).join('') : '<div style="color:#ccc;">尚無完成紀錄</div>'}
                </div>
                <div style="display:flex; justify-content:flex-end; gap:25px; margin-top:20px;">
                    <i class="fas fa-sticky-note" style="color:#ccc;" onclick="editCliNote('${c.n}')"></i>
                    <i class="fas fa-calendar-plus" style="color:${styC}; font-size:1.8rem;" onclick="popBooking('${c.n}','${c.p}','${c.lastSty}')"></i>
                </div>
            </div>`;
        }).join('');
        // 自動生成姓氏索引
    const sideNav = document.getElementById('cli-side-nav');
    if (sideNav) {
        // 抓取過濾後的所有客人姓氏開頭並排序
        const initials = [...new Set(filtered.map(c => c.n[0]))].sort();
        sideNav.innerHTML = initials.map(char => `
            <div class="side-nav-item" onclick="scrollToChar('${char}')">${char}</div>
        `).join('');
    }
    }
function renderDay(ds) {
    const days = ['日','一','二','三','四','五','六'];
    const dayOfWeek = days[new Date(ds).getDay()];
    const titleEl = document.getElementById('day-title');
    if(titleEl) titleEl.innerText = `${ds} (週${dayOfWeek})`;

    // --- 資料備份與恢復協議 (旗艦接通版) ---
    
    // 新增：觸發選檔的開關，解決 iPad 沒反應的問題
    function triggerLoad() {
        let fileIn = document.getElementById('file-in');
        if (!fileIn) {
            fileIn = document.createElement('input');
            fileIn.type = 'file';
            fileIn.id = 'file-in';
            fileIn.style.display = 'none';
            fileIn.onchange = function() { handleFile(this); };
            document.body.appendChild(fileIn);
        }
        fileIn.click();
    }

    function exportToFile() { 
        const data = JSON.stringify(store);
        const blob = new Blob([data], {type: 'application/json'}); 
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(blob); 
        a.download = `Salon_Backup_${new Date().toLocaleDateString('sv')}.json`; 
        a.click(); 
    }

    function handleFile(input) {
        if (!input.files || !input.files[0]) return;
        const reader = new FileReader();
        reader.onload = function() {
            try {
                const importedData = JSON.parse(reader.result);
                // 結構自動補全
                if (!importedData.stylists) importedData.stylists = store.stylists;
                if (!importedData.appointments) importedData.appointments = [];
                if (!importedData.clients) importedData.clients = [];
                
                store = importedData; 
                saveS(); 
                
                Swal.fire({ 
                    title: '復原成功', 
                    text: '資料已全數匯入', 
                    icon: 'success', 
                    customClass: { popup: 'swal-pill' } 
                }).then(() => { 
                    location.reload(); 
                });
            } catch (e) { 
                Swal.fire('錯誤', '檔案格式不正確', 'error'); 
            }
        };
        reader.readAsText(input.files[0]);
    }

    async function pickLuxeColor(type, id = null) {
        const curColor = type === 'off' ? (store.offColor || '#e5e5ea') : store.stylists.find(x => x.id == id).color;
        
        // 透過 SweetAlert 跳出專用選色器，解決平板攔截問題
        const { value: resColor } = await Swal.fire({
            title: '選擇顏色',
            html: `<input type="color" id="swal-color-p" value="${curColor}" style="width:150px; height:150px; border:none; background:none; cursor:pointer;">`,
            showCancelButton: true,
            confirmButtonText: '確定套用',
            customClass: { popup: 'swal-pill' },
            preConfirm: () => document.getElementById('swal-color-p').value
        });

        if (resColor) {
            if (type === 'off') store.offColor = resColor;
            else { const s = store.stylists.find(x => x.id == id); if(s) s.color = resColor; }
            saveS();

            initMonth();

    }

    }

    // 二次確認：刪除人員
    function confirmDelSty(id, name) {
        Swal.fire({
            title: '確定移除人員？',
            text: `移除【${name}】後，預約顏色顯示將受影響`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: '確定移除',
            customClass: { popup: 'swal-pill' }
        }).then(res => {
            if (res.isConfirmed) {
                store.stylists = store.stylists.filter(s => s.id !== id);
                saveS(); renderSet();
            }
        });
    }
// 在最下面 initMonth() 之前貼上這段，確保選單會出現設計師
    const fillStySelect = () => {
        const sel = document.getElementById('cli-f-sty');
        if(sel) {
            sel.innerHTML = '<option value="">所有設計師</option>' + 
                store.stylists.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }
    };
    // 執行一次填充
    fillStySelect();
    function updateBizHour() {
        store.startH = document.getElementById('start-h').value;
        store.endH = document.getElementById('end-h').value;
        saveS();
        if(window.renderDay) renderDay(curD.toLocaleDateString('sv'));
    }
    function initMonth() {
        const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
        const pick = document.getElementById('m-picker').value ? new Date(document.getElementById('m-picker').value + "-01") : new Date();
        const year = pick.getFullYear(), month = pick.getMonth(), todayStr = new Date().toLocaleDateString('sv');
        const days = new Date(year, month + 1, 0).getDate(); let sDay = new Date(year, month, 1).getDay(); sDay = sDay === 0 ? 6 : sDay - 1;
        for(let i=0; i<sDay; i++) grid.appendChild(document.createElement('div'));
        for(let d=1; d<=days; d++) {
            const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const el = document.createElement('div'); el.className = 'cal-day';
            if(ds === todayStr) el.classList.add('today-highlight');
            if(store.offDays.includes(ds)) el.style.background = store.offColor;
            const dots = [...new Set(store.appointments.filter(a => a.date === ds).map(a => store.stylists.find(st => st.id == a.styId)?.color || '#ddd'))].map(c => `<div style="width:12px;height:12px;border-radius:50%;background:${c};display:inline-block;margin:3px;"></div>`).join('');
            el.innerHTML = `<div>${d}</div><div style="margin-top:10px;">${dots}</div>`;
            el.onclick = () => { curD = new Date(ds); showP('pg-day'); };
            grid.appendChild(el);
        }
    }

  async function addCliTrig() {
        const { value: r } = await Swal.fire({
            title: '新增顧客',
            customClass: { popup: 'swal-pill' },
            html: `
                <input id="cn" class="luxe-btn" style="width:100%;margin-bottom:15px;" placeholder="姓名">
                <input id="cp" class="luxe-btn" style="width:100%;margin-bottom:15px;" placeholder="電話">
                <select id="cs" class="luxe-btn" style="width:100%;margin-bottom:15px;">${store.stylists.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
                <div style="display:flex; gap:10px; justify-content:center; align-items:center;">
                    <div style="font-weight:900; color:var(--gold);">生日</div>
                    <input id="cm" class="luxe-btn" style="width:65px; text-align:center; padding:10px;" placeholder="月" type="number">
                    <span style="font-weight:900;">/</span>
                    <input id="cd" class="luxe-btn" style="width:65px; text-align:center; padding:10px;" placeholder="日" type="number">
                </div>`,
            preConfirm: () => ({
                n: document.getElementById('cn').value,
                p: document.getElementById('cp').value,
                s: document.getElementById('cs').value,
                m: document.getElementById('cm').value,
                d: document.getElementById('cd').value
            })
        });
        if (r && r.n) {
            store.clients.push({ n: r.n, p: r.p, lastSty: r.s, bm: r.m, bd: r.d });
            saveS(); renderCli();
        }
    }

   // --- 賈伯斯風格：點擊空白處自動關閉建議視窗 ---
    window.addEventListener('click', function(e) {
        // 抓取所有的建議視窗（包含搜尋欄與預約彈窗內的）
        const boxes = document.querySelectorAll('.suggest-box');
        
        boxes.forEach(box => {
            // 如果點擊的地方「不是」輸入框，也不是建議視窗本身，就隱藏它
            // 這樣在登記顧客資料時，點一下旁邊空白處，清單就會消失
            if (!e.target.closest('.luxe-btn') && !e.target.closest('.suggest-box') && !e.target.closest('input')) {
                box.style.display = 'none';
            }
        });
    });
    async function editStyTrig(id, oldN) { const {value:n}=await Swal.fire({title:'更名', input:'text', inputValue:oldN, customClass:{popup:'swal-pill'}}); if(n){store.stylists.find(x=>x.id==id).name=n; saveS(); renderSet();} }
    async function addStyTrig() { const {value:n}=await Swal.fire({title:'姓名',input:'text',customClass:{popup:'swal-pill'}}); if(n){store.stylists.push({id:Date.now(),name:n,color:'#D4AF37'});saveS();renderSet();} }
    async function addTagTrig() { const {value:n}=await Swal.fire({title:'服務項目',input:'text',customClass:{popup:'swal-pill'}}); if(n){store.tags.push({id:Date.now(),name:n});saveS();renderSet();} }
    function exportToFile() { const b=new Blob([JSON.stringify(store)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`Salon_Backup.json`; a.click(); }

    function handleFile(i) {
        const r = new FileReader();
        r.onload = () => {
            try {
                let importedData = JSON.parse(r.result);
                if (!importedData.startH) importedData.startH = "11:00"; 
                if (!importedData.endH) importedData.endH = "19:00";
                if (!importedData.offColor) importedData.offColor = "#e5e5ea"; 
                if (importedData.appointments) {
                    importedData.appointments = importedData.appointments.map(a => ({
                        ...a, id: a.id || String(Date.now() + Math.random()), tags: a.tags || [], done: a.done || false
                    }));
                }
                store = importedData; saveS();
                Swal.fire({ title: '復原成功', icon: 'success', customClass: { popup: 'swal-pill' } }).then(() => { location.reload(); });
            } catch (e) { Swal.fire('錯誤', '檔案讀取失敗', 'error'); }
        };
        r.readAsText(i.files[0]);
    }

    function toggleAptDone(id, ds) { const a = store.appointments.find(x => String(x.id) === String(id)); if(a) { a.done = !a.done; saveS(); renderDay(ds); } }
    async function delApt(id, ds) { store.appointments = store.appointments.filter(a => String(a.id) !== String(id)); saveS(); renderDay(ds); }
    async function delCli(n) { store.clients = store.clients.filter(x => x.n !== n); saveS(); renderCli(); }
    async function delRecord(id) { store.appointments = store.appointments.filter(a => String(a.id) !== String(id)); saveS(); renderCli(); }
    async function contactCustomer(p) { await Swal.fire({ title: '聯絡', customClass: { popup: 'swal-pill' }, html: `<div style="display:flex; gap:20px; justify-content:center;"><a href="tel:${p}" class="luxe-btn" style="text-decoration:none; flex:1; border-radius:40px;">撥打</a><a href="sms:${p}" class="luxe-btn" style="text-decoration:none; flex:1; border-radius:40px;">簡訊</a></div>`, showConfirmButton: false }); }

    document.getElementById('m-picker').value = new Date().toISOString().slice(0,7);
    // --- 側邊索引跳轉函數：閃現定位法 ---
// A-Z 側邊跳轉
function scrollToChar(char) {
    const firstMatch = store.clients.find(c => c.n.startsWith(char));
    if (firstMatch) {
        const target = document.getElementById(`cli-card-${firstMatch.n}`);
        if (target) {
            target.scrollIntoView({ behavior: 'auto', block: 'start' });
            target.style.background = "rgba(212, 175, 55, 0.2)";
            setTimeout(() => target.style.background = "#fff", 800);
        }
    }
}

// 五彩標籤核心大腦：變色 + 自動寫入備註 [cite: 2026-02-28]
function togglePill(aptId, tagCode, tagName) {
    const apt = store.appointments.find(x => String(x.id) === String(aptId));
    if (!apt) return;
    if (!apt.tags) apt.tags = [];
    
    const idx = apt.tags.indexOf(tagCode);
    if (idx > -1) {
        apt.tags.splice(idx, 1); // 變回灰色
        apt.note_full = (apt.note_full || "").replace(tagName, "").trim(); 
    } else {
        apt.tags.push(tagCode); // 點亮顏色
        apt.note_full = ((apt.note_full || "") + " " + tagName).trim();
    }
    saveS();
    renderDay(document.getElementById('day-title').innerText.split(' ')[0]); 
}
    initMonth(); renderCli(); renderSet();
</script>
