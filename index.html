<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="專屬空間">
    <title>專屬1號 - Salon V299</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1d1d1f; --gold: #D4AF37; --luxe-border: rgba(212, 175, 55, 0.4); --glass: rgba(255, 255, 255, 0.45); --round-pill: 40px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #fff; position: fixed; }
        body { font-family: 'Noto Sans TC', sans-serif; color: var(--primary); display: flex; flex-direction: column; }

        .glow-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(to right, #1d1d1f 20%, #D4AF37 40%, #D4AF37 60%, #1d1d1f 80%); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }

        .fab { position: fixed; bottom: 140px; right: 40px; width: 85px; height: 85px; background: #fff; border: 2.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2.5rem; z-index: 3000; animation: breathe 3s ease-in-out infinite; box-shadow: 0 15px 35px rgba(212,175,55,0.25); }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

        .luxe-btn { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--luxe-border); border-radius: var(--round-pill); padding: 18px 32px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem; height: 65px; transition: 0.3s; width: 100%; border-sizing: border-box; }
        .luxe-btn:active { transform: scale(0.95); }

        .header { padding: 65px 45px 25px; display: flex; justify-content: space-between; align-items: flex-end; background: rgba(255,255,255,0.85); backdrop-filter: blur(35px); z-index: 1000; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 220px; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin: 15px 45px; border-radius: 40px; overflow: hidden; background: #f2f2f7; border: 0.3px solid var(--gold); }
        .cal-day { background: #fff; min-height: 135px; padding: 20px; cursor: pointer; border: 0.3px solid rgba(212, 175, 55, 0.15); font-size: 1.5rem; position: relative; }
        .cal-day.today-highlight { background: rgba(212, 175, 55, 0.08) !important; }

        .client-grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; padding: 25px 45px; }
        .client-card { border-radius: 35px; padding: 30px; background: #fff; border: 0.8px solid var(--luxe-border); border-left: 15px solid var(--sty-color, #eee); box-shadow: 0 10px 35px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 15px; }
        
        /* 修改對話框專屬樣式 */
        .pop-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 100%; overflow: hidden; }
        .pop-row { display: flex; gap: 10px; width: 100%; }
        .pop-input { background: #f2f2f7; border: 1px solid transparent; border-radius: 20px; padding: 15px 20px; font-size: 1.2rem; font-weight: 700; width: 100%; transition: 0.3s; }
        .pop-input:focus { border-color: var(--gold); background: #fff; }
        .pop-label { font-size: 0.9rem; color: #888; font-weight: 900; margin-bottom: 4px; padding-left: 10px; }
        .drawer-btn { background: #fff; border: 1px solid var(--gold); border-radius: 20px; padding: 15px; text-align: center; font-weight: 900; color: var(--gold); cursor: pointer; }

        .suggest-box { position: absolute; width: 100%; background: #fff; border-radius: 20px; z-index: 9999; display: none; border: 2px solid var(--gold); max-height: 200px; overflow-y: auto; margin-top: 5px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .suggest-item { padding: 15px; border-bottom: 0.5px solid #eee; font-weight: 800; font-size: 1.1rem; color: var(--primary); }

        .lane-container { display: flex; overflow-x: auto; padding: 35px 45px; gap: 30px; flex: 1; align-items: flex-start; }
        .lane { flex: 1; min-width: 380px; display: flex; flex-direction: column; gap: 20px; }
        .apt-card { padding: 30px; background: #fff; border-radius: 40px; border: 1px solid var(--luxe-border); border-left: 15px solid var(--c); position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; transition: 0.4s; }
        .apt-card.completed { opacity: 0.3 !important; background: #f9f9fb !important; filter: grayscale(1); }

        .nav { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 750px; height: 105px; background: rgba(255,255,255,0.92); backdrop-filter: blur(40px); display: flex; justify-content: space-around; align-items: center; border-radius: 50px; border: 1px solid var(--luxe-border); z-index: 2000; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; font-size: 1.6rem; }
        .nav-item.active { color: var(--gold); transform: scale(1.1); }
        
        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: flex; flex-direction: column; }
        .swal-pill { border-radius: 40px !important; padding: 30px !important; width: 90vw !important; max-width: 500px !important; }
        .tag-chip { display: inline-block; padding: 10px 18px; border-radius: 15px; border: 1px solid var(--gold); margin: 5px; font-weight: 800; font-size: 1rem; cursor: pointer; background: #fff; }
        .tag-chip.selected { background: var(--gold); color: #fff; }
    </style>
</head>
<body>

<div id="pg-res" class="page active">
    <div class="header"><div class="glow-title">專屬空間</div><div style="display:flex; gap:20px; align-items:center;"><div class="luxe-btn" style="width:auto;" onclick="goToday()">今天</div><input type="month" id="m-picker" onchange="initMonth()" class="luxe-btn" style="width: 180px; background:#f2f2f7;"></div></div>
    <div class="calendar-header" style="display:grid; grid-template-columns: repeat(7, 1fr); margin: 25px 45px 0; text-align: center; font-size: 1.1rem; font-weight: 900; color: #aaa;"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="content-scroll"><div id="cal-grid" class="calendar-grid"></div></div>
</div>

<div id="pg-cli" class="page">
    <div class="header">
        <div style="font-size: 2.6rem; font-weight: 900;">顧客</div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div style="position:relative;">
                <div class="luxe-btn" style="width:auto; padding:0 20px;" onclick="popCliSearch()"><i class="fas fa-search"></i></div>
                <div id="cli-sw-box" class="suggest-box" style="width:300px; right:0;"></div>
            </div>
            <select id="cli-f-sty" class="luxe-btn" style="width:auto;" onchange="renderCli()"></select>
            <div class="luxe-btn" onclick="addCliTrig()" style="width:auto; font-size:2.2rem; padding:12px 25px;">+</div>
        </div>
    </div>
    <div class="content-scroll"><div class="client-grid-container" id="cli-list"></div></div>
</div>

<div id="pg-set" class="page">
    <div class="header"><div style="font-size: 2.6rem; font-weight: 900;">設定</div></div>
    <div class="content-scroll" style="padding:0 45px;">
        <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888; font-size:1.3rem;">1. 排休連選</p><div style="display:flex; gap:25px;"><div class="luxe-btn" onclick="pickOffMulti()">選擇日期</div><input type="color" id="off-c" onchange="store.offColor=this.value;saveS();initMonth();" style="width:75px;height:75px;border:none;background:none;"></div><div id="off-tags" style="margin-top:25px; display:flex; flex-wrap:wrap; gap:12px;"></div></div>
        <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888; font-size:1.3rem;">2. 人員管理</p><div id="s-sty-list"></div><div class="luxe-btn" style="margin-top:25px;" onclick="addStyTrig()">+ 新增人員</div></div>
        <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888; font-size:1.3rem;">3. 服務項目</p><div id="s-tag-list" style="display:flex; flex-wrap:wrap;"></div><div class="luxe-btn" style="margin-top:25px;" onclick="addTagTrig()">+ 新增項目</div></div>
    </div>
</div>

<div id="pg-day" class="page">
    <div class="header"><div style="display:flex; align-items:center; gap:25px;"><i class="fas fa-chevron-left luxe-btn" style="width:auto; border:none;" onclick="showP('pg-res')"></i><i class="fas fa-chevron-left luxe-btn" style="width:auto;" onclick="shiftDay(-1)"></i><div id="day-title" style="font-weight:900; font-size:2rem;"></div><i class="fas fa-chevron-right luxe-btn" style="width:auto;" onclick="shiftDay(1)"></i></div><div class="luxe-btn" style="width:auto;" onclick="goToday()">今天</div></div>
    <div class="lane-container" id="day-lanes"></div>
</div>

<button class="fab" onclick="popBooking()"><i class="fas fa-plus"></i></button>

<div class="nav">
    <div onclick="showP('pg-res')" id="n-res" class="nav-item active"><i class="fas fa-calendar-alt"></i><br><span style="font-size:1rem; font-weight:900;">預約表</span></div>
    <div onclick="showP('pg-cli')" id="n-cli" class="nav-item"><i class="fas fa-user-circle"></i><br><span style="font-size:1rem; font-weight:900;">顧客</span></div>
    <div onclick="showP('pg-set')" id="n-set" class="nav-item"><i class="fas fa-sliders-h"></i><br><span style="font-size:1rem; font-weight:900;">設定</span></div>
</div>

<script>
    let curD = new Date();
    let tempTags = [];
    let cliKw = "";
    let store = JSON.parse(localStorage.getItem('SALON_MASTER_FINAL_LOCK_V299')) || {
        offColor: "#e5e5ea", stylists: [{id: 1, name: 'Tonny', color: '#1d1d1f'}, {id: 2, name: 'Apple', color: '#D4AF37'}],
        tags: [{id: 1, name: '剪髮'}, {id: 2, name: '洗髮'}], appointments: [], clients: [], offDays: []
    };

    function saveS() { localStorage.setItem('SALON_MASTER_FINAL_LOCK_V299', JSON.stringify(store)); }

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id.includes('res')) { document.getElementById('n-res').classList.add('active'); initMonth(); }
        else if(id==='pg-cli') { document.getElementById('n-cli').classList.add('active'); renderCli(); }
        else if(id==='pg-set') { document.getElementById('n-set').classList.add('active'); renderSet(); }
        else if(id==='pg-day') { renderDay(curD.toLocaleDateString('sv')); }
    }

    function goToday() { curD = new Date(); initMonth(); renderDay(curD.toLocaleDateString('sv')); showP('pg-day'); }
    function shiftDay(v) { curD.setDate(curD.getDate() + v); renderDay(curD.toLocaleDateString('sv')); }

    // --- 預約對話框「專屬1號」優化版 ---
    async function popBooking(n="", p="", sId=null, editId=null) {
        const apt = editId ? store.appointments.find(a => String(a.id) === String(editId)) : null;
        const oldName = n; 
        tempTags = apt ? [...apt.tags] : [];

        const { value: res } = await Swal.fire({
            title: '快速預約',
            confirmButtonText: '完成預約',
            showCancelButton: true,
            cancelButtonText: '取消',
            customClass: { popup: 'swal-pill' },
            html: `
            <div class="pop-container">
                <div style="position:relative; text-align:left;">
                    <div class="pop-label">顧客姓名</div>
                    <div class="pop-row">
                        <input id="pop-n" class="pop-input" value="${n}" placeholder="輸入姓名" oninput="searchStored(this, 'pop-box')">
                        <div style="background:#f2f2f7; border-radius:20px; padding:10px; display:flex; align-items:center; gap:5px; min-width:80px;">
                            <input type="checkbox" id="pop-sv" style="width:20px;height:20px;" checked>
                            <span style="font-size:0.9rem; font-weight:900;">儲存</span>
                        </div>
                    </div>
                    <div id="pop-box" class="suggest-box"></div>
                </div>

                <div style="text-align:left;">
                    <div class="pop-label">聯絡電話</div>
                    <input id="pop-p" class="pop-input" value="${p}" placeholder="電話號碼">
                </div>

                <div class="pop-row">
                    <div style="flex:2; text-align:left;">
                        <div class="pop-label">安排設計師</div>
                        <select id="pop-s" class="pop-input">
                            ${store.stylists.map(s=>`<option value="${s.id}" ${Number(s.id)===Number(sId||(apt?apt.styId:1))?'selected':''}>${s.name}</option>`).join('')}
                        </select>
                    </div>
                    <div style="flex:1; text-align:left;">
                        <div class="pop-label">人數</div>
                        <input id="pop-c" type="number" class="pop-input" value="${apt?apt.count:1}">
                    </div>
                </div>

                <div style="text-align:left;">
                    <div class="pop-label">服務項目</div>
                    <div class="drawer-btn" onclick="document.getElementById('pop-tg').style.display=(document.getElementById('pop-tg').style.display==='none'?'block':'none')">
                        <i class="fas fa-bars"></i> 選擇服務項目 (已選 ${tempTags.length})
                    </div>
                    <div id="pop-tg" style="display:none; background:#f9f9f9; padding:15px; border-radius:15px; margin-top:10px; border:1.5px dashed var(--gold);">
                        ${store.tags.map(t=>`<div class="tag-chip ${tempTags.includes(t.name)?'selected':''}" onclick="this.classList.toggle('selected'); toggleTag('${t.name}')">${t.name}</div>`).join('')}
                    </div>
                </div>

                <div style="text-align:left;">
                    <div class="pop-label">金額與詳細備註</div>
                    <textarea id="pop-amt" class="pop-input" style="height:80px; resize:none;" placeholder="在此輸入金額或其它要求...">${apt?apt.note:''}</textarea>
                </div>

                <div class="pop-row">
                    <div style="flex:1; text-align:left;">
                        <div class="pop-label">日期</div>
                        <input id="pop-d" class="pop-input" type="date" value="${apt?apt.date:curD.toLocaleDateString('sv')}">
                    </div>
                    <div style="flex:1; text-align:left;">
                        <div class="pop-label">時間</div>
                        <input id="pop-t" class="pop-input" type="time" value="${apt?apt.time:'12:00'}">
                    </div>
                </div>
            </div>
            `,
            preConfirm: () => ({
                n: document.getElementById('pop-n').value,
                p: document.getElementById('pop-p').value,
                s: document.getElementById('pop-s').value,
                c: document.getElementById('pop-c').value,
                note: document.getElementById('pop-amt').value,
                d: document.getElementById('pop-d').value,
                t: document.getElementById('pop-t').value,
                sv: document.getElementById('pop-sv').checked
            })
        });

        if(res && res.n) {
            const data = { id: editId || String(Date.now()), name: res.n, p: res.p, styId: res.s, count: res.c, note: res.note, date: res.d, time: res.t, tags: [...tempTags], done: apt?apt.done:false };
            if(editId) store.appointments = store.appointments.map(a => String(a.id) === String(editId) ? data : a);
            else store.appointments.push(data);

            if(res.sv) {
                let c = store.clients.find(x=>x.n == (editId ? oldName : res.n));
                if(c) { c.n = res.n; c.p = res.p; c.lastSty = res.s; }
                else { store.clients.push({n:res.n, p:res.p, lastSty:res.s, bm:'01', bd:'01'}); }
            }
            saveS(); initMonth(); if(editId || res.d === curD.toLocaleDateString('sv')) renderDay(res.d);
        }
    }

    function toggleTag(name) {
        const i = tempTags.indexOf(name);
        if(i > -1) tempTags.splice(i, 1);
        else tempTags.push(name);
    }

    function searchStored(el, boxId) {
        const val = el.value.trim();
        const box = document.getElementById(boxId);
        if(!val) { box.style.display='none'; return; }
        // 搜尋匹配
        const ms = store.clients.filter(c => c.n.includes(val) || c.p.includes(val));
        if(ms.length) {
            box.style.display='block';
            box.innerHTML = ms.map(m => `
                <div class="suggest-item" onclick="pickSug('${m.n}', '${m.p}', '${m.lastSty}', '${boxId}')">
                    <i class="fas fa-user-check" style="color:var(--gold)"></i> ${m.n} (${m.p})
                </div>`).join('');
        } else {
            box.style.display='none';
        }
    }

    function pickSug(n, p, s, boxId) {
        if(boxId === 'sw-box') { cliKw = n; renderCli(); Swal.close(); }
        else {
            document.getElementById('pop-n').value = n;
            document.getElementById('pop-p').value = p;
            document.getElementById('pop-s').value = s;
            document.getElementById('pop-box').style.display = 'none';
        }
    }

    // --- 以下保持「專屬1號」原始邏輯與渲染 ---
    function initMonth() {
        const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
        const pick = document.getElementById('m-picker').value ? new Date(document.getElementById('m-picker').value + "-01") : new Date();
        const year = pick.getFullYear(), month = pick.getMonth(), todayStr = new Date().toLocaleDateString('sv');
        const days = new Date(year, month + 1, 0).getDate(); let sDay = new Date(year, month, 1).getDay(); sDay = sDay === 0 ? 6 : sDay - 1;
        for(let i=0; i<sDay; i++) grid.appendChild(document.createElement('div'));
        for(let d=1; d<=days; d++) {
            const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const el = document.createElement('div'); el.className = 'cal-day';
            if(ds === todayStr) el.classList.add('today-highlight');
            if(store.offDays.includes(ds)) el.style.background = store.offColor;
            const dots = [...new Set(store.appointments.filter(a => a.date === ds).map(a => store.stylists.find(st => st.id == a.styId)?.color || '#ddd'))].map(c => `<div style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block;margin:2px;"></div>`).join('');
            el.innerHTML = `<div>${d}</div><div style="margin-top:5px;">${dots}</div>`;
            el.onclick = () => { curD = new Date(ds); showP('pg-day'); };
            grid.appendChild(el);
        }
    }

    function renderDay(ds) {
        document.getElementById('day-title').innerText = ds; const area = document.getElementById('day-lanes'); area.innerHTML = '';
        const todaysApts = store.appointments.filter(a => a.date === ds); const allTimes = [...new Set(todaysApts.map(a => a.time))].sort();
        store.stylists.forEach(s => {
            const lane = document.createElement('div'); lane.className = 'lane';
            lane.innerHTML = `<div style="text-align:center; font-weight:900; color:${s.color}; font-size:1.8rem; margin-bottom:20px;">${s.name}</div>`;
            allTimes.forEach(t => {
                const matched = todaysApts.filter(a => a.time === t && String(a.styId) === String(s.id));
                if(matched.length) {
                    matched.forEach(a => {
                        const card = document.createElement('div');
                        card.className = `apt-card ${a.done?'completed':''}`;
                        card.style.cssText = `--c:${s.color}; margin-bottom:15px;`;
                        card.innerHTML = `
                            <div style="position:absolute; right:20px; top:20px; display:flex; gap:10px;">
                                <i class="fas fa-check-circle" style="color:${a.done?'var(--gold)':'#eee'}; font-size:1.8rem;" onclick="toggleAptDone('${a.id}', '${ds}')"></i>
                                <i class="fas fa-pen" style="color:#ccc;" onclick="popBooking('${a.name}','${a.p}','${a.styId}','${a.id}')"></i>
                                <i class="fas fa-trash" style="color:rgba(255,0,0,0.1);" onclick="delApt('${a.id}', '${ds}')"></i>
                            </div>
                            <div style="font-weight:900; color:var(--gold);">${a.time}</div>
                            <div style="font-weight:900; font-size:1.8rem;">${a.name} (${a.count}人)</div>
                            <div style="font-size:1rem; color:#888;">${a.tags.join('+')}</div>
                            <div style="color:var(--gold); font-weight:900; margin-top:10px; white-space:pre-wrap;">${a.note}</div>
                        `;
                        lane.appendChild(card);
                    });
                }
            }); area.appendChild(lane);
        });
    }

    function renderCli() {
        const fId = document.getElementById('cli-f-sty').value; const area = document.getElementById('cli-list');
        const filtered = store.clients.filter(c => (fId == "0" || String(c.lastSty) === String(fId)) && (c.n.includes(cliKw) || c.p.includes(cliKw)));
        area.innerHTML = filtered.map(c => {
            const s = store.stylists.find(sty => String(sty.id) === String(c.lastSty));
            return `<div class="client-card" style="--sty-color:${s?.color || '#eee'}">
                <div style="font-weight:900; font-size:1.8rem;">${c.n}</div>
                <div style="font-size:1.2rem; color:#888;">📞 ${c.p}</div>
                <div style="display:flex; justify-content:space-between; margin-top:10px;">
                    <div class="luxe-btn" style="width:auto; height:40px; padding:0 15px;" onclick="popBooking('${c.n}','${c.p}','${c.lastSty}')">預約</div>
                    <div class="luxe-btn" style="width:auto; height:40px; padding:0 15px; color:red; border-color:red;" onclick="delCli('${c.n}')">刪除</div>
                </div>
            </div>`;
        }).join('');
        document.getElementById('cli-f-sty').innerHTML = '<option value="0">全部人員</option>' + store.stylists.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    function renderSet() {
        document.getElementById('off-tags').innerHTML = store.offDays.map(d => `<span style="font-size:1.1rem; padding:8px 15px; margin:5px; border:1px solid var(--gold); border-radius:15px;">${d}</span>`).join('');
        document.getElementById('s-sty-list').innerHTML = store.stylists.map(s => `<div style="display:flex; align-items:center; gap:15px; margin-bottom:10px;">
            <input type="color" value="${s.color}" onchange="store.stylists.find(x=>x.id==${s.id}).color=this.value;saveS();renderSet();">
            <span style="font-weight:900;">${s.name}</span>
            <i class="fas fa-trash" onclick="store.stylists=store.stylists.filter(x=>x.id!=${s.id});saveS();renderSet();"></i>
        </div>`).join('');
        document.getElementById('s-tag-list').innerHTML = store.tags.map(t => `<div class="tag-chip">${t.name} <i class="fas fa-times" onclick="store.tags=store.tags.filter(x=>x.id!=${t.id});saveS();renderSet();"></i></div>`).join('');
    }

    async function pickOffMulti() {
        await Swal.fire({
            title: '連選排休',
            html: `<div id="sw-cal" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:5px;"></div>`,
            didOpen: () => {
                const g = document.getElementById('sw-cal');
                const y = new Date().getFullYear(), m = new Date().getMonth();
                const days = new Date(y, m+1, 0).getDate();
                for(let d=1; d<=days; d++) {
                    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const el = document.createElement('div');
                    el.style.cssText="padding:10px; border:1px solid #eee; cursor:pointer;";
                    el.innerText=d;
                    if(store.offDays.includes(ds)) el.style.background = store.offColor;
                    el.onclick = () => {
                        const i = store.offDays.indexOf(ds);
                        if(i>-1) store.offDays.splice(i,1); else store.offDays.push(ds);
                        saveS(); el.style.background = store.offDays.includes(ds)?store.offColor:'#fff';
                    };
                    g.appendChild(el);
                }
            }
        });
        initMonth();
    }

    async function addStyTrig() { const {value:n}=await Swal.fire({title:'姓名',input:'text'}); if(n){store.stylists.push({id:Date.now(),name:n,color:'#D4AF37'});saveS();renderSet();} }
    async function addTagTrig() { const {value:n}=await Swal.fire({title:'服務項目',input:'text'}); if(n){store.tags.push({id:Date.now(),name:n});saveS();renderSet();} }
    async function addCliTrig() { const {value:r}=await Swal.fire({title:'新增顧客', html:'<input id="cn" class="pop-input" placeholder="姓名"><input id="cp" class="pop-input" placeholder="電話">', preConfirm:()=>({n:document.getElementById('cn').value, p:document.getElementById('cp').value})}); if(r && r.n){store.clients.push({n:r.n,p:r.p,lastSty:1,bm:'01',bd:'01'});saveS();renderCli();} }
    function toggleAptDone(id, ds) { const a = store.appointments.find(x => String(x.id) === String(id)); if(a) { a.done = !a.done; saveS(); renderDay(ds); } }
    function delApt(id, ds) { store.appointments = store.appointments.filter(a => String(a.id) !== String(id)); saveS(); renderDay(ds); }
    function delCli(n) { store.clients = store.clients.filter(x => x.n !== n); saveS(); renderCli(); }

    document.getElementById('m-picker').value = new Date().toISOString().slice(0,7);
    initMonth(); renderCli(); renderSet();
</script>
</body>
</html>
