<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="專屬1號">
    <title>專屬1號 - Salon V299</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1d1d1f; --gold: #D4AF37; --luxe-border: rgba(212, 175, 55, 0.4); --glass: rgba(255, 255, 255, 0.85); --round-pill: 40px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #fff; position: fixed; }
        body { font-family: 'Noto Sans TC', sans-serif; color: var(--primary); display: flex; flex-direction: column; }

        .glow-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(to right, #1d1d1f 20%, #D4AF37 40%, #D4AF37 60%, #1d1d1f 80%); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }

        .fab { position: fixed; bottom: 140px; right: 40px; width: 85px; height: 85px; background: #fff; border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2.5rem; z-index: 3000; box-shadow: 0 10px 30px rgba(212,175,55,0.3); }

        .luxe-btn { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--gold); border-radius: var(--round-pill); padding: 15px 25px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.1rem; height: 55px; transition: 0.3s; width: 100%; }
        .luxe-btn:active { transform: scale(0.96); opacity: 0.8; }

        .header { padding: 65px 45px 25px; display: flex; justify-content: space-between; align-items: flex-end; background: rgba(255,255,255,0.9); backdrop-filter: blur(25px); z-index: 1000; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 220px; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin: 15px 45px; border-radius: 35px; overflow: hidden; background: #fff; border: 1px solid var(--gold); }
        .cal-day { background: #fff; min-height: 130px; padding: 15px; cursor: pointer; border: 0.3px solid rgba(212, 175, 55, 0.2); font-size: 1.4rem; position: relative; }
        .cal-day.today-highlight { background: rgba(212, 175, 55, 0.1) !important; }

        .client-card { border-radius: 30px; padding: 25px; background: #fff; border: 1px solid var(--gold); border-left: 12px solid var(--sty-color, #eee); margin: 0 45px 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 10px; }

        .pop-input { background: #fff; border: 1px solid var(--gold); border-radius: 18px; padding: 15px; font-size: 1.2rem; font-weight: 700; width: 100%; color: var(--primary); }
        .pop-label { font-size: 0.9rem; color: var(--gold); font-weight: 900; margin-bottom: 5px; padding-left: 5px; }
        
        .suggest-box { position: absolute; width: 100%; background: #fff; border-radius: 18px; z-index: 9999; display: none; border: 1px solid var(--gold); max-height: 200px; overflow-y: auto; margin-top: 5px; }
        .suggest-item { padding: 15px; border-bottom: 0.5px solid rgba(212,175,55,0.1); font-weight: 800; font-size: 1.1rem; }

        .lane-container { display: flex; overflow-x: auto; padding: 35px 45px; gap: 30px; flex: 1; }
        .lane { flex: 1; min-width: 350px; display: flex; flex-direction: column; gap: 20px; }
        .apt-card { padding: 25px; background: #fff; border-radius: 35px; border: 1px solid var(--gold); border-left: 12px solid var(--c); position: relative; }
        .apt-card.completed { opacity: 0.35; filter: grayscale(1); }

        .nav { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 750px; height: 100px; background: rgba(255,255,255,0.95); backdrop-filter: blur(30px); display: flex; justify-content: space-around; align-items: center; border-radius: 50px; border: 1px solid var(--gold); z-index: 2000; }
        .nav-item { text-align: center; color: #bbb; cursor: pointer; }
        .nav-item.active { color: var(--gold); transform: scale(1.1); font-weight: 900; }
        
        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: flex; flex-direction: column; }
        .swal-pill { border-radius: 35px !important; border: 1px solid var(--gold) !important; }
        .tag-chip { display: inline-block; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--gold); margin: 5px; font-weight: 800; cursor: pointer; }
        .tag-chip.selected { background: var(--gold); color: #fff; }
    </style>
</head>
<body>

<div id="pg-res" class="page active">
    <div class="header"><div class="glow-title">專屬空間</div><div style="display:flex; gap:15px;"><div class="luxe-btn" style="width:auto; height:45px;" onclick="goToday()">今天</div><input type="month" id="m-picker" onchange="initMonth()" class="luxe-btn" style="width: 160px; height:45px; background:#fff;"></div></div>
    <div class="calendar-header" style="display:grid; grid-template-columns: repeat(7, 1fr); margin: 20px 45px 0; text-align: center; font-weight: 900; color: var(--gold);"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="content-scroll"><div id="cal-grid" class="calendar-grid"></div></div>
</div>

<div id="pg-cli" class="page">
    <div class="header"><div style="font-size: 2.4rem; font-weight: 900;">顧客</div><div style="display:flex; gap:15px;"><div class="luxe-btn" style="width:auto; height:45px;" onclick="popCliSearch()"><i class="fas fa-search"></i></div><div class="luxe-btn" onclick="addCliTrig()" style="width:auto; height:45px; font-size:1.5rem;">+</div></div></div>
    <div class="content-scroll"><div id="cli-list"></div></div>
</div>

<div id="pg-set" class="page">
    <div class="header"><div style="font-size: 2.4rem; font-weight: 900;">設定</div></div>
    <div class="content-scroll" style="padding:0 45px;">
        <div style="margin-bottom:50px;"><p style="font-weight:900; color:var(--gold);">排休連選</p><div style="display:flex; gap:20px;"><div class="luxe-btn" onclick="pickOffMulti()">選擇日期</div><input type="color" id="off-c" onchange="store.offColor=this.value;saveS();initMonth();" style="width:55px;height:55px;border:none;"></div><div id="off-tags" style="margin-top:15px; display:flex; flex-wrap:wrap; gap:8px;"></div></div>
        <div style="margin-bottom:50px;"><p style="font-weight:900; color:var(--gold);">人員管理</p><div id="s-sty-list"></div><div class="luxe-btn" style="margin-top:20px;" onclick="addStyTrig()">+ 新增人員</div></div>
        <div style="margin-bottom:50px;"><p style="font-weight:900; color:var(--gold);">服務項目</p><div id="s-tag-list" style="display:flex; flex-wrap:wrap;"></div><div class="luxe-btn" style="margin-top:20px;" onclick="addTagTrig()">+ 新增項目</div></div>
    </div>
</div>

<div id="pg-day" class="page">
    <div class="header"><div style="display:flex; align-items:center; gap:15px;"><i class="fas fa-chevron-left luxe-btn" style="width:auto; border:none; color:var(--gold);" onclick="showP('pg-res')"></i><i class="fas fa-chevron-left luxe-btn" style="width:auto; height:45px;" onclick="shiftDay(-1)"></i><div id="day-title" style="font-weight:900; font-size:1.6rem; color:var(--gold);"></div><i class="fas fa-chevron-right luxe-btn" style="width:auto; height:45px;" onclick="shiftDay(1)"></i></div></div>
    <div class="lane-container" id="day-lanes"></div>
</div>

<button class="fab" onclick="popBooking()"><i class="fas fa-plus"></i></button>

<div class="nav">
    <div onclick="showP('pg-res')" id="n-res" class="nav-item active"><i class="fas fa-calendar-alt"></i><br><span style="font-size:0.9rem;">預約表</span></div>
    <div onclick="showP('pg-cli')" id="n-cli" class="nav-item"><i class="fas fa-user-circle"></i><br><span style="font-size:0.9rem;">顧客</span></div>
    <div onclick="showP('pg-set')" id="n-set" class="nav-item"><i class="fas fa-sliders-h"></i><br><span style="font-size:0.9rem;">設定</span></div>
</div>

<script>
    let curD = new Date();
    let tempTags = [];
    let store = JSON.parse(localStorage.getItem('SALON_MASTER_FINAL_LOCK_V299')) || {
        offColor: "#e5e5ea", stylists: [{id: 1, name: 'Tonny', color: '#1d1d1f'}, {id: 2, name: 'Apple', color: '#D4AF37'}],
        tags: [{id: 1, name: '剪髮'}, {id: 2, name: '洗髮'}], appointments: [], clients: [], offDays: []
    };

    function saveS() { localStorage.setItem('SALON_MASTER_FINAL_LOCK_V299', JSON.stringify(store)); }

    function getWeekDay(ds) {
        const weeks = ['日', '一', '二', '三', '四', '五', '六'];
        return ' (星期' + weeks[new Date(ds).getDay()] + ')';
    }

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id.includes('res')) { document.getElementById('n-res').classList.add('active'); initMonth(); }
        else if(id==='pg-cli') { document.getElementById('n-cli').classList.add('active'); renderCli(); }
        else if(id==='pg-set') { document.getElementById('n-set').classList.add('active'); renderSet(); }
        else if(id==='pg-day') { renderDay(curD.toLocaleDateString('sv')); }
    }

    function goToday() { curD = new Date(); renderDay(curD.toLocaleDateString('sv')); showP('pg-day'); }
    function shiftDay(v) { curD.setDate(curD.getDate() + v); renderDay(curD.toLocaleDateString('sv')); }

    async function confirmDel() {
        const res = await Swal.fire({
            title: '確定要刪除嗎？',
            text: "此操作無法恢復！",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#D4AF37',
            cancelButtonColor: '#aaa',
            confirmButtonText: '確定刪除',
            cancelButtonText: '取消',
            customClass: { popup: 'swal-pill' }
        });
        return res.isConfirmed;
    }

    async function popBooking(n="", p="", sId=null, editId=null) {
        const apt = editId ? store.appointments.find(a => String(a.id) === String(editId)) : null;
        tempTags = apt ? [...apt.tags] : [];
        const { value: res } = await Swal.fire({
            title: '預約',
            confirmButtonText: '確定',
            showCancelButton: true,
            cancelButtonText: '取消',
            customClass: { popup: 'swal-pill' },
            html: `
            <div style="display:flex; flex-direction:column; gap:12px; text-align:left;">
                <div style="position:relative;">
                    <div class="pop-label">姓名</div>
                    <div style="display:flex; gap:8px;">
                        <input id="pop-n" class="pop-input" value="${n}" placeholder="輸入姓名" oninput="searchStored(this, 'pop-box')">
                        <div style="border:1px solid var(--gold); border-radius:15px; padding:10px; display:flex; align-items:center; gap:5px;">
                            <input type="checkbox" id="pop-sv" checked> <span style="font-size:0.8rem; font-weight:900;">存</span>
                        </div>
                    </div>
                    <div id="pop-box" class="suggest-box"></div>
                </div>
                <div><div class="pop-label">電話</div><input id="pop-p" class="pop-input" value="${p}"></div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><div class="pop-label">設計師</div><select id="pop-s" class="pop-input">${store.stylists.map(s=>`<option value="${s.id}" ${Number(s.id)===Number(sId||(apt?apt.styId:1))?'selected':''}>${s.name}</option>`).join('')}</select></div>
                    <div style="flex:0.5;"><div class="pop-label">人數</div><input id="pop-c" type="number" class="pop-input" value="${apt?apt.count:1}"></div>
                </div>
                <div>
                    <div class="pop-label">項目</div>
                    <div class="luxe-btn" style="height:45px; font-size:0.9rem;" onclick="document.getElementById('pop-tg').style.display=(document.getElementById('pop-tg').style.display==='none'?'block':'none')">選擇服務項目</div>
                    <div id="pop-tg" style="display:none; margin-top:10px; border:1px solid var(--gold); padding:10px; border-radius:15px;">
                        ${store.tags.map(t=>`<div class="tag-chip ${tempTags.includes(t.name)?'selected':''}" onclick="this.classList.toggle('selected'); toggleTag('${t.name}')">${t.name}</div>`).join('')}
                    </div>
                </div>
                <div><div class="pop-label">金額與詳細備註</div><textarea id="pop-amt" class="pop-input" style="height:80px; resize:none;" placeholder="在此輸入金額或其它要求...">${apt?apt.note:''}</textarea></div>
                <div style="display:flex; gap:10px;">
                    <input id="pop-d" class="pop-input" type="date" value="${apt?apt.date:curD.toLocaleDateString('sv')}">
                    <input id="pop-t" class="pop-input" type="time" value="${apt?apt.time:'12:00'}">
                </div>
            </div>`,
            preConfirm: () => ({ n: document.getElementById('pop-n').value, p: document.getElementById('pop-p').value, s: document.getElementById('pop-s').value, c: document.getElementById('pop-c').value, note: document.getElementById('pop-amt').value, d: document.getElementById('pop-d').value, t: document.getElementById('pop-t').value, sv: document.getElementById('pop-sv').checked })
        });
        if(res && res.n) {
            const data = { id: editId || String(Date.now()), name: res.n, p: res.p, styId: res.s, count: res.c, note: res.note, date: res.d, time: res.t, tags: [...tempTags], done: apt?apt.done:false };
            if(editId) store.appointments = store.appointments.map(a => String(a.id) === String(editId) ? data : a); else store.appointments.push(data);
            if(res.sv) {
                let c = store.clients.find(x=>x.n == res.n);
                if(c) { c.p = res.p; c.lastSty = res.s; } else { store.clients.push({n:res.n, p:res.p, lastSty:res.s, bm:'01', bd:'01', note:''}); }
            }
            saveS(); renderDay(res.d);
        }
    }

    function toggleTag(name) {
        const i = tempTags.indexOf(name);
        if(i > -1) tempTags.splice(i, 1); else tempTags.push(name);
    }

    function searchStored(el, boxId) {
        const val = el.value.trim(); const box = document.getElementById(boxId);
        if(!val) { box.style.display='none'; return; }
        const ms = store.clients.filter(c => c.n.includes(val) || c.p.includes(val));
        if(ms.length) { box.style.display='block'; box.innerHTML = ms.map(m => `<div class="suggest-item" onclick="pickSug('${m.n}', '${m.p}', '${m.lastSty}', '${boxId}')">${m.n} (${m.p})</div>`).join(''); } 
        else box.style.display='none';
    }

    function pickSug(n, p, s, boxId) {
        document.getElementById('pop-n').value=n; document.getElementById('pop-p').value=p; document.getElementById('pop-s').value=s; document.getElementById('pop-box').style.display='none';
    }

    function renderDay(ds) {
        document.getElementById('day-title').innerText = ds + getWeekDay(ds);
        const area = document.getElementById('day-lanes'); area.innerHTML = '';
        const todaysApts = store.appointments.filter(a => a.date === ds);
        store.stylists.forEach(s => {
            const lane = document.createElement('div'); lane.className = 'lane';
            lane.innerHTML = `<div style="text-align:center; font-weight:900; color:${s.color}; font-size:1.5rem; border-bottom:1px solid var(--gold); padding-bottom:10px;">${s.name}</div>`;
            todaysApts.filter(a => String(a.styId) === String(s.id)).sort((a,b)=>a.time.localeCompare(b.time)).forEach(a => {
                const card = document.createElement('div');
                card.className = `apt-card ${a.done?'completed':''}`;
                card.style.setProperty('--c', s.color);
                card.innerHTML = `
                    <div style="position:absolute; right:15px; top:15px; display:flex; gap:12px;">
                        <i class="fas fa-check-circle" style="color:${a.done?var(--gold):'#eee'}; font-size:1.6rem;" onclick="toggleAptDone('${a.id}', '${ds}')"></i>
                        <i class="fas fa-pen" style="color:var(--gold);" onclick="popBooking('${a.name}','${a.p}','${a.styId}','${a.id}')"></i>
                        <i class="fas fa-trash" style="color:rgba(255,0,0,0.2);" onclick="delAptWithConfirm('${a.id}', '${ds}')"></i>
                    </div>
                    <div style="font-weight:900; color:var(--gold);">${a.time}</div>
                    <div style="font-weight:900; font-size:1.8rem;">${a.name} (${a.count}人)</div>
                    <div style="font-size:1rem; color:#888;">${a.tags.join(' + ')}</div>
                    <div style="margin-top:10px; font-weight:700; color:var(--gold); white-space:pre-wrap;">${a.note}</div>
                `;
                lane.appendChild(card);
            });
            area.appendChild(lane);
        });
    }

    async function delAptWithConfirm(id, ds) { if(await confirmDel()){ store.appointments = store.appointments.filter(a => String(a.id) !== String(id)); saveS(); renderDay(ds); }}

    function renderCli() {
        const area = document.getElementById('cli-list'); area.innerHTML = '';
        store.clients.forEach(c => {
            const s = store.stylists.find(sty => String(sty.id) === String(c.lastSty));
            const card = document.createElement('div');
            card.className = 'client-card';
            card.style.setProperty('--sty-color', s?.color || '#eee');
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <div style="font-weight:900; font-size:1.6rem;">${c.n} <span style="font-size:1rem; color:var(--gold);">(${s?.name||''})</span></div>
                        <div style="font-weight:700; color:#888;">📞 ${c.p} | 🎂 ${c.bm}/${c.bd}</div>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <a href="tel:${c.p}" style="color:var(--gold); font-size:1.4rem;"><i class="fas fa-phone-alt"></i></a>
                        <i class="fas fa-edit" style="color:var(--gold); font-size:1.4rem;" onclick="editCli('${c.n}')"></i>
                        <i class="fas fa-trash" style="color:rgba(255,0,0,0.2); font-size:1.4rem;" onclick="delCliWithConfirm('${c.n}')"></i>
                    </div>
                </div>
                <div class="luxe-btn" style="height:40px; margin-top:10px;" onclick="popBooking('${c.n}','${c.p}','${c.lastSty}')">快速預約</div>
            `;
            area.appendChild(card);
        });
    }

    async function addCliTrig() {
        const { value: r } = await Swal.fire({
            title: '新增顧客',
            confirmButtonText: '確定',
            customClass: { popup: 'swal-pill' },
            html: `
            <div style="text-align:left; display:flex; flex-direction:column; gap:10px;">
                <input id="cn" class="pop-input" placeholder="姓名">
                <input id="cp" class="pop-input" placeholder="電話">
                <div style="display:flex; gap:10px;">
                    <input id="cm" class="pop-input" placeholder="月(MM)">
                    <input id="cd" class="pop-input" placeholder="日(DD)">
                </div>
                <select id="cs" class="pop-input">${store.stylists.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
            </div>`,
            preConfirm: () => ({ n: document.getElementById('cn').value, p: document.getElementById('cp').value, m: document.getElementById('cm').value, d: document.getElementById('cd').value, s: document.getElementById('cs').value })
        });
        if(r && r.n) { store.clients.push({ n: r.n, p: r.p, bm: r.m, bd: r.d, lastSty: r.s }); saveS(); renderCli(); }
    }

    async function editCli(oldN) {
        const c = store.clients.find(x => x.n === oldN);
        const { value: r } = await Swal.fire({
            title: '修改資料',
            confirmButtonText: '確定',
            customClass: { popup: 'swal-pill' },
            html: `
            <div style="text-align:left; display:flex; flex-direction:column; gap:10px;">
                <input id="en" class="pop-input" value="${c.n}">
                <input id="ep" class="pop-input" value="${c.p}">
                <div style="display:flex; gap:10px;">
                    <input id="em" class="pop-input" value="${c.bm}">
                    <input id="ed" class="pop-input" value="${c.bd}">
                </div>
            </div>`,
            preConfirm: () => ({ n: document.getElementById('en').value, p: document.getElementById('ep').value, m: document.getElementById('em').value, d: document.getElementById('ed').value })
        });
        if(r) { Object.assign(c, r); saveS(); renderCli(); }
    }

    async function delCliWithConfirm(n) { if(await confirmDel()){ store.clients = store.clients.filter(x => x.n !== n); saveS(); renderCli(); }}

    function initMonth() {
        const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
        const pick = document.getElementById('m-picker').value ? new Date(document.getElementById('m-picker').value + "-01") : new Date();
        const year = pick.getFullYear(), month = pick.getMonth(), todayStr = new Date().toLocaleDateString('sv');
        const days = new Date(year, month + 1, 0).getDate(); let sDay = new Date(year, month, 1).getDay(); sDay = sDay === 0 ? 6 : sDay - 1;
        for(let i=0; i<sDay; i++) grid.appendChild(document.createElement('div'));
        for(let d=1; d<=days; d++) {
            const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const el = document.createElement('div'); el.className = 'cal-day';
            if(ds === todayStr) el.classList.add('today-highlight');
            if(store.offDays.includes(ds)) el.style.background = store.offColor;
            const dots = [...new Set(store.appointments.filter(a => a.date === ds).map(a => store.stylists.find(st => st.id == a.styId)?.color || '#ddd'))].map(c => `<div style="width:8px;height:8px;border-radius:50%;background:${c};display:inline-block;margin:1px;"></div>`).join('');
            el.innerHTML = `<div>${d}</div><div style="margin-top:5px;">${dots}</div>`;
            el.onclick = () => { curD = new Date(ds); showP('pg-day'); };
            grid.appendChild(el);
        }
    }

    function renderSet() {
        document.getElementById('off-tags').innerHTML = store.offDays.map(d => `<span style="font-size:0.9rem; padding:5px 10px; border:1px solid var(--gold); border-radius:10px;">${d}</span>`).join('');
        document.getElementById('s-sty-list').innerHTML = store.stylists.map(s => `<div style="display:flex; align-items:center; gap:15px; margin-bottom:10px;"><input type="color" value="${s.color}" onchange="store.stylists.find(x=>x.id==${s.id}).color=this.value;saveS();"><span style="font-weight:900;">${s.name}</span><i class="fas fa-trash" style="color:rgba(255,0,0,0.2);" onclick="delStyWithConfirm(${s.id})"></i></div>`).join('');
        document.getElementById('s-tag-list').innerHTML = store.tags.map(t => `<div class="tag-chip">${t.name} <i class="fas fa-times" onclick="delTagWithConfirm(${t.id})"></i></div>`).join('');
    }

    async function delStyWithConfirm(id) { if(await confirmDel()){ store.stylists=store.stylists.filter(x=>x.id!=id); saveS(); renderSet(); }}
    async function delTagWithConfirm(id) { if(await confirmDel()){ store.tags=store.tags.filter(x=>x.id!=id); saveS(); renderSet(); }}
    
    function toggleAptDone(id, ds) { const a = store.appointments.find(x => String(x.id) === String(id)); if(a) { a.done = !a.done; saveS(); renderDay(ds); } }

    document.getElementById('m-picker').value = new Date().toISOString().slice(0,7);
    initMonth(); renderCli(); renderSet();
</script>
</body>
</html>
