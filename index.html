<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EXCLUSIVE SPACE</title>
    <style>
        :root {
            --accent: #007AFF;
            --liquid-bg: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --glass-white: rgba(255, 255, 255, 0.45);
            --blur: blur(30px);
            --danger: #FF3B30;
        }

        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, "SF Pro Display", "PingFang TC", sans-serif;
            background: var(--liquid-bg); overflow: hidden; color: #1c1c1e; position: fixed;
        }

        ::-webkit-scrollbar { display: none; }

        header {
            height: 90px; display: flex; align-items: center; padding: env(safe-area-inset-top) 40px 0;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.3); z-index: 1000;
        }

        .shop-id { 
            font-size: 26px; font-weight: 900; letter-spacing: -1.5px; 
            background: linear-gradient(to right, #1c1c1e, #666); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-right: 40px; cursor: pointer;
        }

        .controls-group { flex: 1; max-width: 500px; display: flex; gap: 10px; margin-right: 20px; }
        
        .search-container { position: relative; flex: 2; }
        .search-container input {
            width: 100%; background: rgba(255, 255, 255, 0.35); border: none;
            padding: 12px 20px 12px 45px; border-radius: 20px; outline: none;
            font-size: 16px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2);
            user-select: text;
        }
        .search-container::before { content: '🔍'; position: absolute; left: 15px; top: 12px; opacity: 0.4; }

        .filter-container { flex: 1; }
        .filter-container select {
            width: 100%; background: rgba(255, 255, 255, 0.35); border: none;
            padding: 10px 15px; border-radius: 20px; outline: none;
            font-size: 14px; font-weight: 700; backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2); color: #1c1c1e;
        }

        /* 強化標籤導覽列顯示 */
        .tab-bar { display: flex; gap: 12px; margin-left: auto; align-items: center; }
        .tab { 
            padding: 12px 24px; border-radius: 20px; cursor: pointer; 
            font-size: 16px; font-weight: 600; color: rgba(0,0,0,0.3); 
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            background: rgba(255,255,255,0.05); display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tab.active { 
            background: #fff; 
            color: #000; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.12); 
            transform: translateY(-2px);
            border: 1px solid #fff;
            font-weight: 800;
        }
        .tab-set-btn { font-size: 14px; opacity: 0.3; }

        .add-tab-btn { 
            width: 42px; height: 42px; border-radius: 15px; 
            background: rgba(255,255,255,0.4); display: flex; 
            justify-content: center; align-items: center; 
            cursor: pointer; font-weight: bold; font-size: 22px; 
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .add-tab-btn:hover { background: #fff; transform: rotate(90deg) scale(1.1); }

        #main-slider { display: flex; height: calc(100vh - 90px); transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .page { 
            min-width: 100vw; height: 100%; overflow-y: scroll; 
            padding: 40px; box-sizing: border-box; display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); 
            align-content: start; gap: 30px; -webkit-overflow-scrolling: touch;
        }

        .card { background: var(--glass-white); border-radius: 42px; padding: 30px; border: 1px solid rgba(255,255,255,0.5); backdrop-filter: var(--blur); box-shadow: 0 25px 50px rgba(0,0,0,0.06); position: relative; }
        .card-dots { position: absolute; top: 30px; right: 30px; width: 35px; height: 35px; background: rgba(255,255,255,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; gap: 3px; }
        .card-dots span { width: 4px; height: 4px; background: #1c1c1e; border-radius: 50%; }
        .card-name { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1.5px; }
        .card-sub { font-size: 15px; color: rgba(0,0,0,0.5); font-weight: 600; line-height: 1.6; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 25px 0; }
        .cell { aspect-ratio: 1; background: rgba(255,255,255,0.4); border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.3); transition: 0.3s; font-size: 16px; font-weight: 800; color: rgba(0,0,0,0.2); overflow: hidden; }
        .cell.used { background: rgba(255,255,255,0.95); border: none; }
        .cell img { width: 85%; height: 60%; object-fit: contain; }
        .cell .time { font-size: 9px; color: #8e8e93; transform: scale(0.8); margin-top: 4px; }

        .add-placeholder { border: 3px dashed rgba(255,255,255,0.6); border-radius: 42px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: rgba(0,0,0,0.3); font-weight: 800; cursor: pointer; min-height: 350px; transition: 0.4s; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.1); backdrop-filter: blur(35px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: rgba(255, 255, 255, 0.9); border-radius: 45px; padding: 45px; width: 90%; max-width: 550px; border: 1px solid white; box-shadow: 0 30px 80px rgba(0,0,0,0.15); max-height: 85vh; overflow-y: auto; }

        /* 預覽視窗樣式 */
        .preview-img { width: 100%; background: white; border-radius: 25px; margin-bottom: 20px; border: 1px solid #eee; }
        .preview-time { font-size: 24px; font-weight: 800; text-align: center; color: var(--accent); margin-bottom: 10px; }

        input, select, textarea { width: 100%; padding: 18px; margin: 12px 0; border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); background: rgba(255,255,255,0.5); font-size: 16px; font-weight: 600; outline: none; box-sizing: border-box; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn { flex: 1; padding: 20px; border-radius: 22px; border: none; font-weight: 800; font-size: 16px; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: rgba(0,0,0,0.05); color: #1c1c1e; }

        canvas { background: white; border-radius: 30px; width: 100%; height: 300px; touch-action: none; border: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body oncontextmenu="return false;">

<header>
    <div class="shop-id" id="shop-name-display" onclick="changeShopName()">EXCLUSIVE SPACE</div>
    <div class="controls-group">
        <div class="search-container">
            <input type="text" id="global-search" placeholder="姓名或手機..." oninput="window.render()">
        </div>
        <div class="filter-container">
            <select id="designer-filter" onchange="window.render()">
                <option value="all">所有設計師</option>
            </select>
        </div>
    </div>
    <div class="tab-bar" id="tab-bar"></div>
    <div class="add-tab-btn" onclick="addNewTab()">＋</div>
</header>

<div id="main-slider"></div>

<!-- 卡片編輯視窗 -->
<div id="card-modal" class="overlay">
    <div class="modal">
        <h2 style="font-weight: 900; letter-spacing: -1px;">保卡設定</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <input type="text" id="in-name" placeholder="顧客姓名">
            <input type="text" id="in-phone" placeholder="電話">
            <input type="number" id="in-stamps" placeholder="服務格數">
            <input type="text" id="in-birthday" placeholder="生日 (MM/DD)">
        </div>
        <select id="in-designer"></select>
        <div style="margin-top:20px;">
            <p style="font-size:14px; font-weight:800; color:#8e8e93; margin-bottom:12px;">設計師簽署</p>
            <div id="staff-sig-box" onclick="openSignature('staff')" style="width:140px; height:75px; background:rgba(255,255,255,0.6); border-radius:20px; display:flex; justify-content:center; align-items:center; cursor:pointer; overflow:hidden; border: 1px solid rgba(0,0,0,0.05);">
                <span style="font-size:13px; color:#c7c7cc;">點擊簽名</span>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="hideModal('card-modal')">返回</button>
            <button class="btn btn-danger" id="delete-card-btn" style="display:none;" onclick="deleteCurrentCard()">刪除卡片</button>
            <button class="btn btn-primary" onclick="saveCard()">存檔</button>
        </div>
    </div>
</div>

<!-- 分頁編輯視窗 -->
<div id="tab-modal" class="overlay">
    <div class="modal">
        <h2>分頁設定</h2>
        <input type="text" id="tab-name-input" placeholder="分頁名稱">
        <textarea id="designer-list-input" rows="2" placeholder="設計師名單 (以逗號隔開)"></textarea>
        <div id="delete-zone" style="border-top: 1px solid rgba(0,0,0,0.05); margin-top: 20px; padding-top: 20px; display: none;">
            <p style="font-size: 14px; font-weight: 800; color: var(--danger);">🚨 刪除頁面安全防護</p>
            <input type="password" id="delete-password" placeholder="輸入 8888 刪除">
            <button class="btn btn-danger" style="width:100%;" onclick="secureDelete()">永久刪除頁面</button>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="hideModal('tab-modal')">取消</button>
            <button class="btn btn-primary" onclick="saveTab()">儲存</button>
        </div>
    </div>
</div>

<!-- 簽名板視窗 -->
<div id="sig-modal" class="overlay">
    <div class="modal" style="max-width:650px;">
        <h2 id="sig-title">電子簽署</h2>
        <canvas id="sig-canvas"></canvas>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="hideModal('sig-modal')">取消</button>
            <button class="btn btn-secondary" onclick="clearCanvas()">重寫</button>
            <button class="btn btn-primary" onclick="confirmSignature()">確認</button>
        </div>
    </div>
</div>

<!-- 簽名放大預覽視窗 -->
<div id="preview-modal" class="overlay">
    <div class="modal" style="max-width:500px;">
        <h2 style="font-weight: 900;">簽名憑證確認</h2>
        <div class="preview-time" id="preview-time-text"></div>
        <img id="preview-image-box" class="preview-img" src="">
        <button class="btn btn-primary" style="width:100%" onclick="hideModal('preview-modal')">確認關閉</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBGLxO3tetJEQ1xYXrg-fb1LOXjnat2MFI",
        authDomain: "salonpos-system.firebaseapp.com",
        projectId: "salonpos-system",
        storageBucket: "salonpos-system.firebasestorage.app",
        messagingSenderId: "122314392059",
        appId: "1:122314392059:web:0bac00f9886b43e3cacb5e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db_data = [];
    window.designers = [];
    let curIdx = 0;
    let cardEditTarget = null;
    let sigMode = '';
    let currentStaffSig = null;
    let custSigTarget = null;
    window.tabEditIdx = null;

    async function syncData() {
        onSnapshot(collection(db, "service_cards"), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length === 0) initDefaultPages();
            else {
                window.db_data = data.sort((a, b) => (a.order || 0) - (b.order || 0));
                window.render();
            }
        });
        onSnapshot(doc(db, "config", "salon_settings"), (docSnap) => {
            if (docSnap.exists()) {
                const config = docSnap.data();
                window.designers = config.designers || [];
                document.getElementById('shop-name-display').innerText = config.shop_name || 'EXCLUSIVE SPACE';
                updateDesignerSelects();
            }
        });
    }

    async function initDefaultPages() {
        const defaults = [{ title: '精選護髮', cards: [], order: 0 }, { title: '歸檔紀錄', cards: [], isArchive: true, order: 1 }];
        for (let p of defaults) await setDoc(doc(db, "service_cards", p.title), p);
    }

    window.render = function() {
        const bar = document.getElementById('tab-bar');
        const slider = document.getElementById('main-slider');
        const searchTerm = (document.getElementById('global-search')?.value || "").toLowerCase().trim();
        const filterDesigner = document.getElementById('designer-filter')?.value || "all";
        if (!bar || !slider) return;
        bar.innerHTML = ''; slider.innerHTML = '';

        window.db_data.forEach((page, pIdx) => {
            const t = document.createElement('div');
            // 強化當前分頁顯示
            t.className = `tab ${pIdx === curIdx ? 'active' : ''}`;
            const txt = document.createElement('span');
            txt.innerText = page.title;
            txt.onclick = () => { curIdx = pIdx; window.updateSlider(); window.render(); };
            t.appendChild(txt);
            if (!page.isArchive) {
                const setBtn = document.createElement('span');
                setBtn.innerHTML = '⚙'; setBtn.className = 'tab-set-btn';
                setBtn.onclick = (e) => { e.stopPropagation(); window.editTab(pIdx); };
                t.appendChild(setBtn);
            }
            bar.appendChild(t);

            const pg = document.createElement('div'); 
            pg.className = 'page';
            const cardsToDisplay = (page.cards || []).filter(card => {
                const matchesSearch = searchTerm === "" || card.name.toLowerCase().includes(searchTerm) || card.phone.includes(searchTerm);
                const matchesDesigner = filterDesigner === "all" || card.designer === filterDesigner;
                return matchesSearch && matchesDesigner;
            });
            
            cardsToDisplay.forEach((card) => {
                const realCIdx = page.cards.findIndex(c => c === card);
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <div class="card-dots" onclick="window.showCardEdit(${pIdx}, ${realCIdx})"><span></span><span></span><span></span></div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-sub">📞 ${card.phone} | ✨ ${card.designer}</div>
                    <div class="grid">
                        ${Array.from({length: card.stamps}).map((_, i) => {
                            const s = (card.signs || {})[i];
                            // 已簽名顯示縮圖並可放大，未簽名點擊簽署
                            return `<div class="cell ${s?'used':''}" onclick="${s ? `window.previewSig('${s.img}', '${s.time}')` : `window.openSignature('cust', ${pIdx}, ${realCIdx}, ${i})`}">
                                ${s ? `<img src="${s.img}"><div class="time">${s.time}</div>` : i+1}
                            </div>`;
                        }).join('')}
                    </div>
                `;
                pg.appendChild(cardEl);
            });
            
            if (!page.isArchive && searchTerm === "" && filterDesigner === "all") {
                const add = document.createElement('div');
                add.className = 'add-placeholder';
                add.innerHTML = `<span style="font-size:45px;">＋</span>售出新卡`;
                add.onclick = () => window.showCardEdit(pIdx, null);
                pg.appendChild(add);
            }
            slider.appendChild(pg);
        });
        window.updateSlider();
    }

    // 簽名放大預覽功能
    window.previewSig = function(img, time) {
        document.getElementById('preview-image-box').src = img;
        document.getElementById('preview-time-text').innerText = "簽署時間：" + time;
        document.getElementById('preview-modal').style.display = 'flex';
    }

    window.showCardEdit = function(pIdx, cIdx) {
        cardEditTarget = (cIdx !== null) ? { pIdx, cIdx } : null;
        document.getElementById('delete-card-btn').style.display = (cIdx !== null) ? 'block' : 'none';
        if (cardEditTarget) {
            const c = window.db_data[pIdx].cards[cIdx];
            document.getElementById('in-name').value = c.name;
            document.getElementById('in-phone').value = c.phone;
            document.getElementById('in-stamps').value = c.stamps;
            document.getElementById('in-birthday').value = c.birthday;
            document.getElementById('in-designer').value = c.designer || "";
            currentStaffSig = c.staffSig;
            document.getElementById('staff-sig-box').innerHTML = c.staffSig ? `<img src="${c.staffSig}" style="height:100%">` : '點擊簽名';
        } else {
            ['in-name', 'in-phone', 'in-stamps', 'in-birthday', 'in-designer'].forEach(id => document.getElementById(id).value = '');
            currentStaffSig = null; document.getElementById('staff-sig-box').innerHTML = '點擊簽名';
        }
        document.getElementById('card-modal').style.display = 'flex';
    }

    window.saveCard = async function() {
        const data = {
            name: document.getElementById('in-name').value || '匿名',
            phone: document.getElementById('in-phone').value || '無',
            stamps: parseInt(document.getElementById('in-stamps').value) || 10,
            birthday: document.getElementById('in-birthday').value || '無',
            designer: document.getElementById('in-designer').value || '未指定',
            staffSig: currentStaffSig,
            signs: cardEditTarget ? window.db_data[cardEditTarget.pIdx].cards[cardEditTarget.cIdx].signs || {} : {}
        };
        if (cardEditTarget) window.db_data[cardEditTarget.pIdx].cards[cardEditTarget.cIdx] = data;
        else window.db_data[curIdx].cards.push(data);
        await saveCloud(); window.hideModal('card-modal');
    }

    async function autoArchive(pIdx, cIdx) {
        const card = window.db_data[pIdx].cards[cIdx];
        const usedCount = Object.keys(card.signs || {}).length;
        if (usedCount >= card.stamps) {
            setTimeout(async () => {
                alert(`🎊 顧客 ${card.name} 護髮完成！卡片已自動歸檔。`);
                const currentTab = window.db_data[pIdx];
                const archiveTab = window.db_data.find(p => p.isArchive);
                const [movedCard] = currentTab.cards.splice(cIdx, 1);
                if (archiveTab) {
                    if(!archiveTab.cards) archiveTab.cards = [];
                    archiveTab.cards.push(movedCard);
                }
                window.render();
                await setDoc(doc(db, "service_cards", currentTab.title), JSON.parse(JSON.stringify(currentTab)));
                if (archiveTab) {
                    await setDoc(doc(db, "service_cards", archiveTab.title), JSON.parse(JSON.stringify(archiveTab)));
                }
            }, 300);
        }
    }

    window.deleteCurrentCard = async function() {
        if (cardEditTarget && confirm("🚨 確定永久刪除此卡片？")) {
            const { pIdx, cIdx } = cardEditTarget;
            window.db_data[pIdx].cards.splice(cIdx, 1);
            await saveCloud();
            window.hideModal('card-modal');
            window.render();
        }
    };

    async function saveCloud() {
        for (let i = 0; i < window.db_data.length; i++) {
            await setDoc(doc(db, "service_cards", window.db_data[i].title), JSON.parse(JSON.stringify(window.db_data[i])));
        }
    }

    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    window.openSignature = function(mode, p, c, s) {
        sigMode = mode;
        if (mode === 'cust') {
            custSigTarget = { p, c, s };
        }
        document.getElementById('sig-modal').style.display = 'flex';
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#1c1c1e';
    }
    let drawing = false;
    canvas.onmousedown = canvas.ontouchstart = (e) => { drawing = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); };
    canvas.onmousemove = canvas.ontouchmove = (e) => { if(!drawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); e.preventDefault(); };
    canvas.onmouseup = canvas.ontouchend = () => drawing = false;
    function getPos(e) { const rect = canvas.getBoundingClientRect(); return { x: (e.touches?e.touches[0].clientX:e.clientX)-rect.left, y: (e.touches?e.touches[0].clientY:e.clientY)-rect.top }; }
    window.clearCanvas = () => ctx.clearRect(0,0,canvas.width,canvas.height);
    
    window.confirmSignature = async function() {
        const url = canvas.toDataURL();
        if (sigMode === 'staff') {
            currentStaffSig = url;
            document.getElementById('staff-sig-box').innerHTML = `<img src="${url}" style="height:100%">`;
            window.hideModal('sig-modal');
        } else {
            const now = new Date();
            const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
            const targetCard = window.db_data[custSigTarget.p].cards[custSigTarget.c];
            if (!targetCard.signs) targetCard.signs = {};
            targetCard.signs[custSigTarget.s] = { img: url, time: timeStr };
            
            window.hideModal('sig-modal');
            window.render(); // 簽完立即刷新本地顯示縮圖
            
            if (!window.db_data[custSigTarget.p].isArchive) {
                await autoArchive(custSigTarget.p, custSigTarget.c);
            } else {
                await saveCloud();
            }
        }
    };

    window.updateSlider = () => document.getElementById('main-slider').style.transform = `translateX(-${curIdx * 100}vw)`;
    window.hideModal = (id) => document.getElementById(id).style.display = 'none';

    window.changeShopName = async function() {
        const n = prompt("店名：", document.getElementById('shop-name-display').innerText);
        if(n) await setDoc(doc(db, "config", "salon_settings"), { shop_name: n }, { merge: true });
    }

    function updateDesignerSelects() {
        const el = document.getElementById('in-designer');
        if (el) el.innerHTML = window.designers.map(d => `<option value="${d}">${d}</option>`).join('');
        const filterEl = document.getElementById('designer-filter');
        if (filterEl) {
            const cur = filterEl.value;
            filterEl.innerHTML = '<option value="all">所有設計師</option>' + window.designers.map(d => `<option value="${d}">${d}</option>`).join('');
            filterEl.value = cur;
        }
    }

    window.addNewTab = () => { window.tabEditIdx = null; document.getElementById('tab-name-input').value = ""; document.getElementById('tab-modal').style.display = 'flex'; };
    window.editTab = (idx) => { window.tabEditIdx = idx; document.getElementById('tab-name-input').value = window.db_data[idx].title; document.getElementById('designer-list-input').value = window.designers.join(','); document.getElementById('tab-modal').style.display = 'flex'; document.getElementById('delete-zone').style.display='block'; };
    
    window.saveTab = async function() {
        const name = document.getElementById('tab-name-input').value.trim();
        const des = document.getElementById('designer-list-input').value.split(',').map(d=>d.trim());
        await setDoc(doc(db, "config", "salon_settings"), { designers: des }, { merge: true });

        if(name) {
            if(window.tabEditIdx !== null) {
                const old = window.db_data[window.tabEditIdx].title;
                if(old !== name) {
                    const pageData = {...window.db_data[window.tabEditIdx], title: name};
                    await setDoc(doc(db, "service_cards", name), JSON.parse(JSON.stringify(pageData)));
                    await deleteDoc(doc(db, "service_cards", old));
                }
            } else {
                await setDoc(doc(db, "service_cards", name), { title: name, cards: [], order: window.db_data.length });
            }
        }
        window.hideModal('tab-modal');
    }

    window.secureDelete = async function() {
        if(document.getElementById('delete-password').value === "8888") {
            await deleteDoc(doc(db, "service_cards", window.db_data[window.tabEditIdx].title));
            curIdx = 0; window.hideModal('tab-modal');
        } else alert("密碼錯誤");
    }

    syncData();
</script>
</body>
</html>
