
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>專屬空間 V318</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="專屬空間">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1d1d1f; --gold: #D4AF37; --luxe-border: rgba(212, 175, 55, 0.4); --glass: rgba(255, 255, 255, 0.6); --round-pill: 40px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #fff; position: fixed; }
        body { font-family: 'Noto Sans TC', sans-serif; color: var(--primary); display: flex; flex-direction: column; }
        
        .swal2-popup {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(25px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 45px !important;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1) !important;
        }
        .swal2-title { color: #1d1d1f !important; font-weight: 900 !important; }
        .swal2-confirm { background: var(--gold) !important; border-radius: 30px !important; font-weight: 900 !important; padding: 12px 35px !important; }

        .glow-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(to right, #1d1d1f 20%, #D4AF37 40%, #D4AF37 60%, #1d1d1f 80%); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .fab { position: fixed; bottom: 140px; right: 40px; width: 85px; height: 85px; background: #fff; border: 2.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2.5rem; z-index: 3000; box-shadow: 0 15px 35px rgba(212,175,55,0.25); }
        .luxe-btn { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--luxe-border); border-radius: var(--round-pill); padding: 18px 32px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem; height: 65px; transition: 0.3s; }
        .header { padding: 65px 45px 25px; display: flex; justify-content: space-between; align-items: flex-end; background: rgba(255,255,255,0.85); backdrop-filter: blur(35px); z-index: 1000; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 220px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin: 15px 45px; border-radius: 40px; overflow: hidden; background: #f2f2f7; border: 0.3px solid var(--gold); }
        .cal-day { background: #fff; min-height: 135px; padding: 20px; cursor: pointer; border: 0.3px solid rgba(212, 175, 55, 0.15); font-size: 1.5rem; position: relative; }
        .cal-day.today-highlight { background: rgba(212, 175, 55, 0.08) !important; }
        .client-grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; padding: 25px 45px; }
        
        .suggest-box { position: absolute; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border: 2px solid var(--gold); border-radius: 20px; z-index: 5000; display: none; max-height: 250px; overflow-y: auto; margin-top: 5px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .suggest-item { padding: 15px 20px; border-bottom: 0.5px solid #eee; font-weight: 900; font-size: 1.2rem; cursor: pointer; color: var(--primary); }
        
        .lane-container { display: flex; overflow-x: auto; padding: 35px 45px; gap: 30px; flex: 1; align-items: flex-start; }
        .lane { flex: 1; min-width: 380px; display: flex; flex-direction: column; gap: 20px; }
        .time-row-space { min-height: 240px; display: flex; flex-direction: row; gap: 12px; align-items: stretch; }
        .apt-card { padding: 30px; background: #fff; border-radius: 40px; border: 1px solid var(--luxe-border); border-left: 15px solid var(--c); position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; transition: 0.4s; }
        .apt-card.completed { opacity: 0.3 !important; background: #f9f9fb !important; filter: grayscale(1); }
        
        .nav { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 750px; height: 105px; background: rgba(255,255,255,0.92); backdrop-filter: blur(40px); display: flex; justify-content: space-around; align-items: center; border-radius: 50px; border: 1px solid var(--luxe-border); z-index: 2000; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; font-size: 1.6rem; }
        .nav-item.active { color: var(--gold); transform: scale(1.1); }
        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: flex; flex-direction: column; }
        
        .tag-pill { font-size: 0.75rem; font-weight: 800; padding: 4px 12px; border-radius: 12px; background: #f0f0f0; color: #aaa; cursor: pointer; border: 1px solid #eee; transition: 0.2s; }
        .tag-pill.active-L { background: #06C755 !important; color: #fff !important; border-color: #06C755 !important; }
        .tag-pill.active-J { background: #ED1C24 !important; color: #fff !important; border-color: #ED1C24 !important; }
        .tag-pill.active-C { background: #8B4513 !important; color: #fff !important; border-color: #8B4513 !important; }
        .tag-pill.active-P { background: #007AFF !important; color: #fff !important; border-color: #007AFF !important; }
        .tag-pill.active-S { background: #6f42c1 !important; color: #fff !important; border-color: #6f42c1 !important; }
        
        .drawer-btn { width: 100%; padding: 20px; background: #f9f9fb; border: 1px solid var(--gold); border-radius: 30px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 900; margin-bottom: 15px; }
        .drawer-content { display: none; padding: 10px; background: #f9f9fb; border-radius: 0 0 30px 30px; border: 1px solid var(--gold); border-top: none; margin-top: -15px; margin-bottom: 15px; text-align: left; }
        .shield-input { border-radius: 15px !important; width: 75px !important; height: 45px !important; text-align: center !important; border: 1.5px solid var(--gold) !important; background: #fff !important; font-weight: 900 !important; font-size: 1.2rem !important; display: inline-block !important; margin: 0 5px !important; -webkit-appearance: none !important; }
        .tag-chip { display: inline-block; padding: 15px 28px; border-radius: 30px; border: 1px solid var(--gold); margin: 8px; font-weight: 900; font-size: 1.2rem; cursor: pointer; background: #fff; transition: 0.3s; }
        .tag-chip.selected { background: linear-gradient(135deg, var(--gold), #f3d060); color: #fff; border-color: var(--gold); }
   /* 手機版自動適應優化 */
        @media (max-width: 480px) {
            .header { padding: 55px 20px 15px; flex-direction: column; align-items: flex-start; gap: 15px; }
            .header div:last-child { width: 100%; justify-content: space-between; }
            .luxe-btn { height: 50px; padding: 10px 20px; font-size: 1rem; border-radius: 25px; }
            .calendar-grid { margin: 5px 10px; border-radius: 25px; }
            .cal-day { min-height: 85px; font-size: 1rem; padding: 8px; }
            .nav { width: 92%; height: 90px; bottom: 25px; border-radius: 45px; }
            .client-grid-container { grid-template-columns: 1fr; padding: 15px; }
        }
   </style>
</head>
<body>

<div id="pg-res" class="page active">
    <div class="header"><div class="glow-title">專屬空間</div><div style="display:flex; gap:20px; align-items:center;"><div class="luxe-btn" onclick="goToday()">今天</div><input type="month" id="m-picker" onchange="initMonth()" class="luxe-btn" style="width: 240px; background:#f2f2f7;"></div></div>
    <div class="calendar-header" style="display:grid; grid-template-columns: repeat(7, 1fr); margin: 25px 45px 0; text-align: center; font-size: 1.1rem; font-weight: 900; color: #aaa;"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="content-scroll"><div id="cal-grid" class="calendar-grid"></div></div>
</div>

<div id="pg-cli" class="page">
    <div class="header">
<div style="font-size: 2.6rem; font-weight: 900; cursor:pointer;" onclick="cliKw=''; renderCli();">顧客</div>        <div style="display:flex; gap:20px; align-items:center;">
            <div style="position:relative;"><div class="luxe-btn" onclick="popCliSearch()"><i class="fas fa-search"></i></div><div id="cli-sw-box" class="suggest-box" style="width:350px; right:0;"></div></div>
            <select id="cli-f-sty" class="luxe-btn" onchange="renderCli()"></select>
            <div class="luxe-btn" onclick="addCliTrig()" style="font-size:2.2rem; padding:12px 35px;">+</div>
        </div>
    </div>
    <div class="content-scroll"><div class="client-grid-container" id="cli-list"></div></div>
</div>

<<div id="pg-set" class="page">
        <div class="header"><div style="font-size: 2.6rem; font-weight: 900;">設定</div></div>
        <div class="content-scroll" style="padding:0 45px;" id="set-content-container"></div>
    </div>

    <div id="pg-day" class="page">
        <div class="header">
            <div style="display:flex; align-items:center; gap:25px;">
                <i class="fas fa-chevron-left luxe-btn" style="border:none;" onclick="showP('pg-res')"></i>
                <i class="fas fa-chevron-left luxe-btn" onclick="shiftDay(-1)"></i>
                <div id="day-title" style="font-weight:900; font-size:2rem;"></div>
                <i class="fas fa-chevron-right luxe-btn" onclick="shiftDay(1)"></i>
            </div>
            <div class="luxe-btn" onclick="goToday()">今天</div>
        </div>
        <div class="lane-container" id="day-lanes"></div>
    </div>

<button class="fab" onclick="popBooking()"><i class="fas fa-plus"></i></button>

<div class="nav">
    <div onclick="showP('pg-res')" id="n-res" class="nav-item active"><i class="fas fa-calendar-alt"></i><br><span style="font-size:1rem; font-weight:900;">預約表</span></div>
    <div onclick="showP('pg-cli')" id="n-cli" class="nav-item"><i class="fas fa-user-circle"></i><br><span style="font-size:1rem; font-weight:900;">顧客</span></div>
    <div onclick="showP('pg-set')" id="n-set" class="nav-item"><i class="fas fa-sliders-h"></i><br><span style="font-size:1rem; font-weight:900;">設定</span></div>
</div>

<script>
    let curD = new Date();
    let tempTags = [];
    let cliKw = "";
    // 鎖死你的 Google Apps Script 雙向同步網址 [cite: 2026-03-01]
    const GAS_URL = "https://script.google.com/macros/s/AKfycbybDgSJuk48LPv4lCIFqiAv3vL3XkK1DdObhw6agADIY4J2GqQiW0Zt3IP35hrIbMVT/exec
    
    let store = JSON.parse(localStorage.getItem('SALON_LOCK_V318')) || {
        startH: "11:00", endH: "19:00", offColor: "#e5e5ea", gSheetUrl: GAS_URL,
        stylists: [{id: 1, name: 'Tonny', color: '#1d1d1f'}, {id: 2, name: 'Apple', color: '#D4AF37'}],
        tags: [{id: 1, name: '剪髮'}, {id: 2, name: '洗髮'}], appointments: [], clients: [], offDays: []
    };
    if(!store.gSheetUrl || store.gSheetUrl !== GAS_URL) store.gSheetUrl = GAS_URL;

    // --- 鋼鐵同步：從雲端抓取最新資料 (GET) [cite: 2026-03-01] ---
    async function pullFromGSheet(isManual = false) {
        if(!GAS_URL) return;
        if(isManual) Swal.showLoading(); 
        try {
            const response = await fetch(GAS_URL);
            const cloudData = await response.json();
            // 確保抓到的是有效的預約資料
            if (cloudData && cloudData.appointments) {
                store = cloudData;
                localStorage.setItem('SALON_LOCK_V318', JSON.stringify(store));
                // 重新渲染畫面
                initMonth(); renderCli(); fillStySelect();
                if(document.getElementById('pg-day').classList.contains('active')) renderDay(curD.toLocaleDateString('sv'));
                if(isManual) Swal.fire({ icon: 'success', title: '雲端同步成功', timer: 1000, showConfirmButton: false });
            }
        } catch (e) {
            console.error("同步抓取失敗", e);
            if(isManual) Swal.fire('同步失敗', '請檢查網路連線', 'error');
        }
    }

    // 修改即自動同步發射 (POST) [cite: 2026-03-01]
    function saveS() { 
        localStorage.setItem('SALON_LOCK_V318', JSON.stringify(store)); 
        syncToGSheet(); 
    }

    async function syncToGSheet() { 
        if(!store.gSheetUrl) return;
        try { await fetch(store.gSheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(store) }); } catch(e) {} 
    }

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id.includes('res')) initMonth(); 
        else if(id==='pg-cli') { fillStySelect(); renderCli(); } 
        else if(id==='pg-set') renderSet(); 
        else if(id==='pg-day') renderDay(curD.toLocaleDateString('sv'));
    }

    // 啟動 App 時自動抓取雲端最新資料
    window.addEventListener('load', () => pullFromGSheet());

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        // 關鍵在這裡：進入顧客頁面前，先啟動你剛貼好的 fillStySelect 函數 [cite: 2026-03-01]
        if(id.includes('res')) initMonth(); 
        else if(id==='pg-cli') { 
            fillStySelect(); // 啟動大腦！
            renderCli(); 
        } 
        else if(id==='pg-set') renderSet(); 
        else if(id==='pg-day') renderDay(curD.toLocaleDateString('sv'));
    }

    function goToday() { curD = new Date(); renderDay(curD.toLocaleDateString('sv')); showP('pg-day'); }
    function shiftDay(v) { curD.setDate(curD.getDate() + v); renderDay(curD.toLocaleDateString('sv')); }

    window.addEventListener('click', e => {
        document.querySelectorAll('.suggest-box').forEach(box => {
            if (!e.target.closest('input') && !e.target.closest('.suggest-box')) box.style.display = 'none';
        });
    });

    function searchStored(el, boxId) {
        const val = el.value.trim(); const box = document.getElementById(boxId);
        if(!val) { box.style.display='none'; return; }
        const ms = store.clients.filter(c => (c.n||c.name||"").includes(val) || (c.p||c.phone||"").includes(val));
        if(ms.length) { box.style.display='block'; box.innerHTML = ms.map(m => `<div class="suggest-item" onclick="pickSug('${m.n||m.name}', '${m.p||m.phone}', '${m.lastSty}', '${boxId}')">${m.n||m.name} (${m.p||m.phone})</div>`).join(''); } else box.style.display='none';
    }

    function pickSug(n, p, s, boxId) {
        if(boxId === 'sw-box' || boxId === 'cli-sw-box') { cliKw = n; renderCli(); Swal.close(); }
        else { document.getElementById('pop-n').value=n; document.getElementById('pop-p').value=p; document.getElementById('pop-s').value=s; document.getElementById('pop-box').style.display='none'; }
    }

    async function popCliSearch() { await Swal.fire({ title: '搜尋', html: `<input id="sw-search" class="luxe-btn" style="width:100%;" oninput="searchStored(this, 'sw-box')"><div id="sw-box" class="suggest-box"></div>`, showConfirmButton: false }); }

    function togglePay(id, code, emoji, labelName, ds) {
        const a = store.appointments.find(x => String(x.id) === String(id));
        if(!a) return;
        if(!a.payTags) a.payTags = [];
        const idx = a.payTags.indexOf(code);
        let note = a.note_full || "";
        const tagText = `${emoji}${labelName}`;
        if(idx > -1) { a.payTags.splice(idx, 1); note = note.replace(tagText, "").trim(); } 
        else { a.payTags.push(code); note = (note + " " + tagText).trim(); }
        a.note_full = note; saveS(); renderDay(ds);
    }

    function renderDay(ds) {
        const days = ['日','一','二','三','四','五','六'];
        document.getElementById('day-title').innerText = `${ds} (週${days[new Date(ds).getDay()]})`; 
        const area = document.getElementById('day-lanes'); area.innerHTML = '';
        const start = parseInt(store.startH || '11'), end = parseInt(store.endH || '19');
        const hours = []; for(let i=start; i<=end; i++) hours.push(`${i}:00`);

        store.stylists.forEach(s => {
            const lane = document.createElement('div'); lane.className = 'lane';
            lane.innerHTML = `<div style="text-align:center; font-weight:900; color:${s.color}; font-size:1.8rem; margin-bottom:20px;">${s.name}</div>`;
            hours.forEach(t => {
                const row = document.createElement('div'); row.className = 'time-row-space'; row.style.position = "relative";
                const matched = store.appointments.filter(a => a.date === ds && a.time.split(':')[0] === t.split(':')[0] && String(a.styId) === String(s.id));
                const label = `<div style="position:absolute; left:-45px; top:12px; font-size:0.75rem; color:#bbb; font-weight:900;">${t}</div>`;
                if(matched.length) {
                    row.innerHTML = label + matched.map(a => {
                        const tagHtml = `<div class="tag-group">
                            <span class="tag-pill ${a.payTags?.includes('L')?'active-L':''}" onclick="event.stopPropagation(); togglePay('${a.id}','L','🟢','Line','${ds}')">Line</span>
                            <span class="tag-pill ${a.payTags?.includes('J')?'active-J':''}" onclick="event.stopPropagation(); togglePay('${a.id}','J','🧧','街口','${ds}')">街口</span>
                            <span class="tag-pill ${a.payTags?.includes('C')?'active-C':''}" onclick="event.stopPropagation(); togglePay('${a.id}','C','💰','現金','${ds}')">現</span>
                            <span class="tag-pill ${a.payTags?.includes('P')?'active-P':''}" onclick="event.stopPropagation(); togglePay('${a.id}','P','🔹','支付','${ds}')">支</span>
                            <span class="tag-pill ${a.payTags?.includes('S')?'active-S':''}" onclick="event.stopPropagation(); togglePay('${a.id}','S','📦','販賣','${ds}')">販</span>
                        </div>`;
                        return `<div class="apt-card ${a.done?'completed':''}" style="--c:${s.color}; margin-left:15px; width:calc(100% - 20px); padding:20px;">
                            ${tagHtml}
                            <div style="position:absolute; right:15px; top:15px; display:flex; gap:12px; align-items:center;">
                                <i class="fas fa-pen" style="color:#ccc; cursor:pointer;" onclick="event.stopPropagation(); popBooking('${a.n||a.name}','${a.p||a.phone}','${a.styId}','${a.id}')"></i>
                                <i class="fas fa-trash-alt" style="color:rgba(255,0,0,0.2); cursor:pointer;" onclick="event.stopPropagation(); confirmDelApt('${a.id}','${ds}')"></i>
                                <i class="fas fa-check-circle" style="color:${a.done?'var(--gold)':'#eee'}; font-size:1.6rem;" onclick="event.stopPropagation(); toggleAptDone('${a.id}','${ds}')"></i>
                            </div>
                            <div style="font-weight:900; color:var(--gold); font-size:1.1rem;">${a.time}</div>
                            <div style="font-weight:900; font-size:1.8rem; margin:5px 0;">${a.n || a.name}</div>
                            <div style="background:rgba(212,175,55,0.05); padding:15px; border-radius:20px; border-left:4px solid var(--gold); margin-top:10px;">
                                <div style="font-weight:900; color:var(--gold); font-size:1.1rem; margin-bottom:5px;">✂️ ${(a.tags || []).join('+') || '服務項目'}</div>
                               <div onclick="event.stopPropagation(); popNoteEdit('${a.id}', '${ds}')" style="font-size:0.95rem; color:#444; line-height:1.5; white-space: pre-wrap; font-weight:700; cursor:pointer; min-height:20px;">${a.note_full || "點擊此處輸入詳細備註..."}</div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px; border-top:1px dashed #eee;">
                                <div style="font-weight:900; color:#888; font-size:1rem;">📞 ${a.p||a.phone||"未留電話"}</div>
                                <div style="font-weight:900; color:var(--gold); font-size:1rem;">👤 ${a.c||a.count||"1"}人</div>
                            </div>
                        </div>`;
                    }).join('');
                } else row.innerHTML = label + `<div style="flex:1; height:40px; margin-left:15px;"></div>`;
                lane.appendChild(row);
            }); area.appendChild(lane);
        });
    }

    // --- 預約視窗：補回勾選同步存檔功能 [cite: 2026-03-01] ---
    async function popBooking(n="", p="", sId=null, editId=null) {
        const apt = editId ? store.appointments.find(a => String(a.id) === String(editId)) : null;
        tempTags = apt ? [...(apt.tags || [])] : [];
        const { value: res } = await Swal.fire({
            title: editId ? '修改預約' : '新增預約', width: '85%',
            html: `
                <div style="position:relative; margin-bottom:15px;">
                    <input id="pop-n" class="luxe-btn" style="width:100%; font-size:1.5rem; border-radius:30px;" value="${n}" placeholder="姓名" oninput="searchStored(this, 'pop-box')">
                    <div id="pop-box" class="suggest-box"></div>
                </div>
                <input id="pop-p" class="luxe-btn" style="width:100%; margin-bottom:15px; border-radius:30px;" value="${p}" placeholder="電話號碼">
                <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center;">
                    <select id="pop-s" class="luxe-btn" style="flex:1.5; border-radius:30px;">${store.stylists.map(s=>`<option value="${s.id}" ${String(s.id)===String(sId||1)?'selected':''}>${s.name}</option>`).join('')}</select>
                    <div style="flex:1; display:flex; align-items:center;">
                        <span style="font-weight:900;">人數</span>
                        <input id="pop-c" class="shield-input" type="text" value="${apt?apt.c||apt.count:''}" placeholder="手填">
                    </div>
                </div>
                <textarea id="pop-note" class="luxe-btn" style="width:100%; height:80px; border-radius:20px; margin-bottom:15px;" placeholder="備註內容...">${apt?apt.note_full||apt.note:""}</textarea>
                <div class="drawer-btn" onclick="const c=document.getElementById('pop-tg-dr'); c.style.display=c.style.display==='block'?'none':'block';">項目 <i class="fas fa-chevron-down"></i></div>
                <div id="pop-tg-dr" class="drawer-content">${store.tags.map(t=>`<div class="tag-chip ${tempTags.includes(t.name)?'selected':''}" onclick="this.classList.toggle('selected'); const i=tempTags.indexOf('${t.name}'); if(i>-1) tempTags.splice(i,1); else tempTags.push('${t.name}')">${t.name}</div>`).join('')}</div>
                
                <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin: 15px 0;">
                    <input type="checkbox" id="pop-save-cli" style="width:22px; height:22px; accent-color:var(--gold);" ${editId?'disabled':'checked'}>
                    <label for="pop-save-cli" style="font-weight:900; color:var(--gold); font-size:1.1rem;">同步存至顧客名冊</label>
                </div>

                <div style="display:flex; gap:10px;"><input id="pop-d" class="luxe-btn" type="date" style="flex:1.5; border-radius:30px;" value="${apt?apt.date:curD.toLocaleDateString('sv')}"><input id="pop-t" class="luxe-btn" type="time" style="flex:1; border-radius:30px;" value="${apt?apt.time:'12:00'}"></div>`,
            preConfirm: () => ({ 
                n: document.getElementById('pop-n').value, 
                p: document.getElementById('pop-p').value, 
                styId: document.getElementById('pop-s').value, 
                c: document.getElementById('pop-c').value, 
                note: document.getElementById('pop-note').value, 
                d: document.getElementById('pop-d').value, 
                t: document.getElementById('pop-t').value,
                saveCli: document.getElementById('pop-save-cli').checked 
            })
        });
        if (res && res.n) {
            const data = { id: editId || String(Date.now()), n: res.n, p: res.p, styId: res.styId, c: res.c, note_full: res.note, date: res.d, time: res.t, tags: [...tempTags], done: apt?apt.done:false, payTags: apt?apt.payTags:[] };
            if (editId) store.appointments = store.appointments.map(a => String(a.id) === String(editId) ? data : a);
            else {
                store.appointments.push(data);
                // 鋼鐵執行：勾選且不存在時快存 [cite: 2026-03-01]
                if(res.saveCli && !store.clients.find(c => (c.n||c.name) === res.n)) {
                    store.clients.push({ n: res.n, p: res.p, lastSty: res.styId, bm: '', bd: '', note: res.note });
                }
            }
            saveS(); renderDay(res.d);
            if(document.getElementById('pg-cli').classList.contains('active')) renderCli();
        }
    }

    // --- 顧客卡片：顯示設計師名稱與最後三次紀錄 [cite: 2026-03-01] ---
    function renderCli() {
        const area = document.getElementById('cli-list');
        const filterSty = document.getElementById('cli-f-sty').value; // 取得選單選中的設計師 ID

        area.innerHTML = store.clients
            .filter(c => {
                const matchKw = (c.n || "").includes(cliKw) || (c.p || "").includes(cliKw);
                const matchSty = !filterSty || String(c.lastSty) === String(filterSty);
                return matchKw && matchSty;
            })
            .map(c => {
                // 核心關鍵：抓取這位設計師的完整資料 [cite: 2026-03-01]
                const sty = store.stylists.find(s => String(s.id) === String(c.lastSty));
                const history = store.appointments.filter(a => (a.n === c.n || a.name === c.n) && a.done).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);

                return `<div id="cli-card-${c.n}" class="apt-card" style="margin-bottom:25px; border-left:12px solid ${sty?.color||'#eee'}; padding:30px; border-radius:40px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <div style="font-weight:900; font-size:2.2rem; margin-bottom:5px;">${c.n}</div>
                            <div style="display:flex; gap:25px; font-size:1.1rem; color:#666; margin-bottom:10px;"><div>📞 ${c.p||"未設定"}</div><div>🎂 ${c.bm||""}/${c.bd||""}</div></div>
                        </div>
                        <div style="background:${sty?.color||'#eee'}; color:${sty?.color==='#1d1d1f'?'#fff':'#1d1d1f'}; padding:8px 18px; border-radius:20px; font-weight:900; font-size:1rem;">
                            👤 ${sty?.name || "未指定"}
                        </div>
                    </div>
                    
                    <div style="background:#fcfcfd; padding:20px; border-radius:25px; border:1px solid #f0f0f0; margin-top:10px;">
                        <div style="font-size:0.8rem; font-weight:900; color:#bbb; margin-bottom:10px;">最近 3 次預約紀錄</div>
                        ${history.length ? history.map(h => `<div style="border-bottom:1px dashed #eee; padding:10px 0;">
                            <div style="display:flex; justify-content:space-between;"><span style="font-weight:900;">📅 ${h.date}</span><span style="color:var(--gold); font-weight:700;">✂️ ${(h.tags||[]).join('+')}</span></div>
                            <div style="font-size:0.9rem; color:#888; margin-top:5px;">📝 ${h.note_full || "無備註"}</div>
                        </div>`).join('') : '<div style="color:#ccc;">尚無紀錄</div>'}
                    </div>
                    
                    <div style="display:flex; justify-content:flex-end; gap:25px; margin-top:20px;">
                        <i class="fas fa-pen" style="color:#ccc; font-size:1.2rem; cursor:pointer;" onclick="editCli('${c.n}')"></i>
                        <i class="fas fa-trash-alt" style="color:rgba(255,0,0,0.1); font-size:1.2rem; cursor:pointer;" onclick="confirmDelCli('${c.n}')"></i>
                    </div>
                </div>`;
            }).join('');
    }

    async function addCliTrig() {
        const { value: r } = await Swal.fire({ title: '新增顧客', html: `<input id="cn" class="luxe-btn" style="width:100%;margin-bottom:15px;border-radius:30px;" placeholder="姓名"><input id="cp" class="luxe-btn" style="width:100%;margin-bottom:15px;border-radius:30px;" placeholder="電話"><select id="cs" class="luxe-btn" style="width:100%;border-radius:30px;">${store.stylists.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><div style="display:flex; gap:5px; justify-content:center; align-items:center; margin-top:20px;"><span style="font-weight:900;">🎂 生日</span><input id="cm" class="shield-input" type="text" placeholder="月"> / <input id="cd" class="shield-input" type="text" placeholder="日"></div>`, preConfirm: () => ({ n: document.getElementById('cn').value, p: document.getElementById('cp').value, s: document.getElementById('cs').value, m: document.getElementById('cm').value, d: document.getElementById('cd').value }) });
        if (r && r.n) { store.clients.push({ n: r.n, p: r.p, lastSty: r.s, bm: r.m, bd: r.d }); saveS(); renderCli(); }
    }

    async function editCli(oldN) {
        const c = store.clients.find(x => x.n === oldN);
        const { value: r } = await Swal.fire({ title: '修改資料', html: `<input id="en" class="luxe-btn" style="width:100%;margin-bottom:15px;border-radius:30px;" value="${c.n}"><input id="ep" class="luxe-btn" style="width:100%;margin-bottom:15px;border-radius:30px;" value="${c.p}"><select id="es" class="luxe-btn" style="width:100%;border-radius:30px;">${store.stylists.map(s=>`<option value="${s.id}" ${String(s.id)===String(c.lastSty)?'selected':''}>${s.name}</option>`).join('')}</select><div style="display:flex; gap:5px; justify-content:center; align-items:center; margin-top:20px;"><span style="font-weight:900;">🎂</span><input id="em" class="shield-input" value="${c.bm||''}" type="text"> / <input id="ed" class="shield-input" value="${c.bd||''}" type="text"></div>`, preConfirm: () => ({ n: document.getElementById('en').value, p: document.getElementById('ep').value, s: document.getElementById('es').value, m: document.getElementById('em').value, d: document.getElementById('ed').value }) });
        if (r) { Object.assign(c, { n:r.n, p:r.p, lastSty:r.s, bm:r.m, bd:r.d }); saveS(); renderCli(); }
    }

    function renderSet() {
        const container = document.getElementById('set-content-container');
        container.innerHTML = `
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">0. 營業時間</p><div style="display:flex; gap:25px;"><input type="time" class="luxe-btn" style="flex:1;" value="${store.startH}" onchange="store.startH=this.value;saveS();">至<input type="time" class="luxe-btn" style="flex:1;" value="${store.endH}" onchange="store.endH=this.value;saveS();"></div></div>
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">1. 排休設定</p><div style="display:flex; align-items:center; gap:20px;"><div class="luxe-btn" onclick="pickOffMulti()" style="flex:1;">選擇月份與日期</div><div onclick="pickLuxeColor('off')" style="width:65px; height:65px; border-radius:50%; background:${store.offColor}; border:4px solid #fff; cursor:pointer;"></div></div></div>
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">2. 人員管理</p>${store.stylists.map(s => `<div class="luxe-btn" style="width:100%; margin-bottom:15px; justify-content:space-between;"><div style="display:flex; align-items:center; gap:20px;"><div onclick="pickLuxeColor('sty', ${s.id})" style="width:40px; height:40px; border-radius:50%; background:${s.color}; border:3.5px solid #fff; cursor:pointer;"></div><span>${s.name}</span></div><div style="display:flex; gap:15px;"><i class="fas fa-pen" onclick="editStyTrig(${s.id},'${s.name}')"></i><i class="fas fa-times" style="color:#ff4d4d;" onclick="confirmDelSty(${s.id})"></i></div></div>`).join('')}<div class="luxe-btn" style="width:100%; border:1px dashed var(--gold); background:transparent; color:var(--gold);" onclick="addStyTrig()">+ 新增人員</div></div>
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">3. 項目管理</p><div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px;">${store.tags.map(t => `<div class="luxe-btn" style="height:auto; padding:10px 25px; border-radius:30px;"><span>${t.name}</span><div style="margin-left:15px; display:flex; gap:12px;"><i class="fas fa-pen" onclick="editTagTrig(${t.id},'${t.name}')"></i><i class="fas fa-times" style="color:#ff4d4d;" onclick="confirmDelTag(${t.id})"></i></div></div>`).join('')}</div><div class="luxe-btn" style="width:100%; border:1px dashed var(--gold); background:transparent; color:var(--gold);" onclick="addTagTrig()">+ 新增項目</div></div>
            <div style="margin-bottom:60px;">
                <p style="font-weight:900; color:#888;">4. 數據備份與雲端同步</p>
                <div class="luxe-btn" style="width:100%; margin-bottom:15px; background:rgba(212,175,55,0.1); border:2px solid var(--gold); color:var(--gold);" onclick="pullFromGSheet(true)">
                    <i class="fas fa-sync-alt" style="margin-right:10px;"></i> 強制從雲端抓取最新資料
                </div>
                <div style="display:flex; gap:25px;">
                    <div class="luxe-btn" style="flex:1;" onclick="exportToFile()">下載存檔</div>
                    <div class="luxe-btn" style="flex:1;" onclick="triggerLoad()">讀取存檔</div>
                </div>
            </div>
        `;
    }
    async function pickLuxeColor(type, id = null) { const cur = type === 'off' ? store.offColor : store.stylists.find(x => x.id == id).color; const { value: res } = await Swal.fire({ title: '選色', html: `<input type="color" id="sw-c" value="${cur}" style="width:150px; height:150px;">`, showCancelButton: true, preConfirm: () => document.getElementById('sw-c').value }); if (res) { if(type === 'off') store.offColor = res; else store.stylists.find(x => x.id == id).color = res; saveS(); renderSet(); initMonth(); } }
    async function pickOffMulti() { const { value: month } = await Swal.fire({ title: '選擇月份', input: 'month', showCancelButton: true }); if (!month) return; await Swal.fire({ title: `${month} 排休設定`, html: '<div id="sw-cal" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;"></div>', didOpen: () => { const g = document.getElementById('sw-cal'); const pick = new Date(month + "-01"); const year = pick.getFullYear(), m = pick.getMonth(); const days = new Date(year, m+1, 0).getDate(); for(let d=1; d<=days; d++) { const ds = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const el = document.createElement('div'); el.innerText = d; el.style.padding = "10px"; el.style.background = store.offDays.includes(ds) ? store.offColor : "#fff"; el.style.border = "1px solid #eee"; el.onclick = () => { const i = store.offDays.indexOf(ds); if(i>-1) store.offDays.splice(i,1); else store.offDays.push(ds); saveS(); el.style.background = store.offDays.includes(ds) ? store.offColor : "#fff"; initMonth(); }; g.appendChild(el); } }}); }
    async function editStyTrig(id, old) { const {value:n}=await Swal.fire({title:'更名', input:'text', inputValue:old}); if(n){store.stylists.find(x=>x.id==id).name=n; saveS(); renderSet();} }
    async function editTagTrig(id, old) { const {value:n}=await Swal.fire({title:'修改項目', input:'text', inputValue:old}); if(n){store.tags.find(x=>x.id==id).name=n; saveS(); renderSet();} }
    async function addTagTrig() { const {value:n}=await Swal.fire({title:'項目名稱', input:'text'}); if(n){store.tags.push({id:Date.now(), name:n}); saveS(); renderSet();} }
    async function addStyTrig() { const {value:n}=await Swal.fire({title:'姓名', input:'text'}); if(n){store.stylists.push({id:Date.now(), name:n, color:'#D4AF37'}); saveS(); renderSet();} }
    
    // --- 萬用檔案讀取邏輯 [cite: 2026-02-28] ---
    function triggerLoad() { const i = document.createElement('input'); i.type = 'file'; i.onchange = e => { const r = new FileReader(); r.onload = () => { let d = JSON.parse(r.result); if (d.appointments) d.appointments = d.appointments.map(a => ({ ...a, n: a.n || a.name, p: a.p || a.phone, c: a.c || a.count })); if (d.clients) d.clients = d.clients.map(c => ({ ...c, n: c.n || c.name, p: c.p || c.phone })); store = d; saveS(); location.reload(); }; r.readAsText(e.target.files[0]); }; i.click(); }
    
    function confirmDelApt(id, ds) { Swal.fire({ title: '刪除預約？', icon: 'warning', showCancelButton: true }).then(res => { if(res.isConfirmed) { store.appointments = store.appointments.filter(a => String(a.id) !== String(id)); saveS(); renderDay(ds); }}); }
    function confirmDelSty(id) { Swal.fire({ title: '移除人員？', icon: 'warning', showCancelButton: true }).then(res => { if(res.isConfirmed) { store.stylists = store.stylists.filter(s => s.id !== id); saveS(); renderSet(); }}); }
    function confirmDelTag(id) { Swal.fire({ title: '移除項目？', icon: 'warning', showCancelButton: true }).then(res => { if(res.isConfirmed) { store.tags = store.tags.filter(t => t.id !== id); saveS(); renderSet(); }}); }
    function confirmDelCli(n) { Swal.fire({ title: '刪除顧客？', icon: 'warning', showCancelButton: true }).then(res => { if(res.isConfirmed) { store.clients = store.clients.filter(x => x.n !== n); saveS(); renderCli(); }}); }
    function toggleAptDone(id, ds) { const a = store.appointments.find(x => String(x.id) === String(id)); if(a) { a.done = !a.done; saveS(); renderDay(ds); } }
    function exportToFile() { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(store)],{type:'application/json'})); a.download=`backup.json`; a.click(); }
    
    function initMonth() {
        const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
        const pick = document.getElementById('m-picker').value ? new Date(document.getElementById('m-picker').value + "-01") : new Date();
        const year = pick.getFullYear(), month = pick.getMonth(), today = new Date().toLocaleDateString('sv');
        const days = new Date(year, month + 1, 0).getDate(); let sDay = new Date(year, month, 1).getDay(); sDay = sDay === 0 ? 6 : sDay - 1;
        for(let i=0; i<sDay; i++) grid.appendChild(document.createElement('div'));
        for(let d=1; d<=days; d++) {
            const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const el = document.createElement('div'); el.className = 'cal-day';
            if(ds === today) el.classList.add('today-highlight');
            if(store.offDays.includes(ds)) el.style.background = store.offColor;
            const dots = [...new Set(store.appointments.filter(a => a.date === ds).map(a => store.stylists.find(st => st.id == a.styId)?.color || '#ddd'))].map(c => `<div style="width:12px;height:12px;border-radius:50%;background:${c};display:inline-block;margin:3px;"></div>`).join('');
            el.innerHTML = `<div>${d}</div><div style="margin-top:10px;">${dots}</div>`;
            el.onclick = () => { curD = new Date(ds); showP('pg-day'); }; grid.appendChild(el);
        }
    }

    const fillStySelect = () => { const sel = document.getElementById('cli-f-sty'); if(sel) sel.innerHTML = '<option value="">所有設計師</option>' + store.stylists.map(s => `<option value="${s.id}">${s.name}</option>`).join(''); };
    document.getElementById('m-picker').value = new Date().toISOString().slice(0,7);
   fillStySelect(); initMonth(); renderCli(); renderSet();
// --- 點擊卡片備註：彈出打字視窗核心 [cite: 2026-03-01] ---
async function popNoteEdit(aptId, ds) {
    const a = store.appointments.find(x => String(x.id) === String(aptId));
    if(!a) return;
    const { value: text } = await Swal.fire({
        title: '詳細備註',
        input: 'textarea',
        inputValue: a.note_full || "",
        inputPlaceholder: '在此輸入內容...',
        showCancelButton: true,
        confirmButtonText: '存檔',
        cancelButtonText: '取消'
    });
    if (text !== undefined) {
        a.note_full = text;
        saveS();
        renderDay(ds); // 存檔後立即刷新
    }
}
</script>
</body>

    // ... 前面所有的代碼都不動 ...

    // --- 強化：重新抓取設計師名單並填入選單 [cite: 2026-03-01] ---
    function fillStySelect() {
        const sel = document.getElementById('cli-f-sty');
        if(sel) {
            sel.innerHTML = '<option value="">所有設計師</option>' + 
                store.stylists.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }
    }
</script>
</html>
