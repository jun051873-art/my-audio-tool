<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>專屬空間 V307 - 鋼鐵鎖死版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1d1d1f; --gold: #D4AF37; --luxe-border: rgba(212, 175, 55, 0.4); --glass: rgba(255, 255, 255, 0.45); --round-pill: 40px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #fff; position: fixed; }
        body { font-family: 'Noto Sans TC', sans-serif; color: var(--primary); display: flex; flex-direction: column; }
        .glow-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(to right, #1d1d1f 20%, #D4AF37 40%, #D4AF37 60%, #1d1d1f 80%); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .fab { position: fixed; bottom: 140px; right: 40px; width: 85px; height: 85px; background: #fff; border: 2.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2.5rem; z-index: 3000; box-shadow: 0 15px 35px rgba(212,175,55,0.25); }
        .luxe-btn { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--luxe-border); border-radius: var(--round-pill); padding: 18px 32px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem; height: 65px; transition: 0.3s; }
        .header { padding: 65px 45px 25px; display: flex; justify-content: space-between; align-items: flex-end; background: rgba(255,255,255,0.85); backdrop-filter: blur(35px); z-index: 1000; border-bottom: 0.5px solid rgba(0,0,0,0.05); }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 220px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin: 15px 45px; border-radius: 40px; overflow: hidden; background: #f2f2f7; border: 0.3px solid var(--gold); }
        .cal-day { background: #fff; min-height: 135px; padding: 20px; cursor: pointer; border: 0.3px solid rgba(212, 175, 55, 0.15); font-size: 1.5rem; position: relative; }
        .cal-day.today-highlight { background: rgba(212, 175, 55, 0.08) !important; }
        .client-grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; padding: 25px 45px; }
        .suggest-box { position: absolute; width: 100%; background: #fff; border-radius: 30px; z-index: 5000; display: none; border: 2px solid var(--gold); max-height: 280px; overflow-y: auto; margin-top: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        .suggest-item { padding: 22px 30px; border-bottom: 0.5px solid #eee; font-weight: 900; font-size: 1.4rem; cursor: pointer; color: var(--primary); text-align: center; }
        .lane-container { display: flex; overflow-x: auto; padding: 35px 45px; gap: 30px; flex: 1; align-items: flex-start; }
        .lane { flex: 1; min-width: 380px; display: flex; flex-direction: column; gap: 20px; }
        .time-row-space { min-height: 240px; display: flex; flex-direction: row; gap: 12px; align-items: stretch; }
        .apt-card { padding: 30px; background: #fff; border-radius: 40px; border: 1px solid var(--luxe-border); border-left: 15px solid var(--c); position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; transition: 0.4s; }
        .apt-card.completed { opacity: 0.3 !important; background: #f9f9fb !important; filter: grayscale(1); }
        .nav { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 750px; height: 105px; background: rgba(255,255,255,0.92); backdrop-filter: blur(40px); display: flex; justify-content: space-around; align-items: center; border-radius: 50px; border: 1px solid var(--luxe-border); z-index: 2000; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; font-size: 1.6rem; }
        .nav-item.active { color: var(--gold); transform: scale(1.1); }
        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: flex; flex-direction: column; }
        .swal-pill { border-radius: 45px !important; padding: 40px !important; border: 1px solid var(--gold) !important; }
        .tag-chip { display: inline-block; padding: 15px 28px; border-radius: 30px; border: 1px solid var(--gold); margin: 8px; font-weight: 900; font-size: 1.2rem; cursor: pointer; background: #fff; transition: 0.3s; }
        .tag-chip.selected { background: linear-gradient(135deg, var(--gold), #f3d060); color: #fff; border-color: var(--gold); }
        .tag-group { display: flex; gap: 6px; justify-content: flex-start; margin-bottom: 12px; }
        .tag-pill { font-size: 0.75rem; font-weight: 800; padding: 3px 10px; border-radius: 12px; background: #f0f0f0; color: #aaa; cursor: pointer; border: 1px solid #eee; transition: 0.3s; }
        .tag-pill.active-L { background: #06C755; color: #fff; border-color: #06C755; }
        .tag-pill.active-J { background: #ED1C24; color: #fff; border-color: #ED1C24; }
        .tag-pill.active-C { background: #8B4513; color: #fff; border-color: #8B4513; }
        .tag-pill.active-P { background: #007AFF; color: #fff; border-color: #007AFF; }
        .tag-pill.active-S { background: #FFCC00; color: #000; border-color: #FFCC00; }
        .drawer-btn { width: 100%; padding: 20px; background: #f9f9fb; border: 1px solid var(--gold); border-radius: 30px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 900; margin-bottom: 15px; }
        .drawer-content { display: none; padding: 10px; background: #f9f9fb; border-radius: 0 0 30px 30px; border: 1px solid var(--gold); border-top: none; margin-top: -15px; margin-bottom: 15px; text-align: left; }
        .side-nav { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 5px; z-index: 4000; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); padding: 10px 5px; border-radius: 15px; border: 0.5px solid var(--luxe-border); }
        .side-nav-item { font-size: 0.8rem; font-weight: 900; color: var(--gold); cursor: pointer; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="pg-res" class="page active">
    <div class="header"><div class="glow-title">專屬空間</div><div style="display:flex; gap:20px; align-items:center;"><div class="luxe-btn" onclick="goToday()">今天</div><input type="month" id="m-picker" onchange="initMonth()" class="luxe-btn" style="width: 240px; background:#f2f2f7;"></div></div>
    <div class="calendar-header" style="display:grid; grid-template-columns: repeat(7, 1fr); margin: 25px 45px 0; text-align: center; font-size: 1.1rem; font-weight: 900; color: #aaa;"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="content-scroll"><div id="cal-grid" class="calendar-grid"></div></div>
</div>

<div id="pg-cli" class="page">
    <div class="header">
        <div style="font-size: 2.6rem; font-weight: 900;">顧客</div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div style="position:relative;"><div class="luxe-btn" onclick="popCliSearch()"><i class="fas fa-search"></i></div><div id="cli-sw-box" class="suggest-box" style="width:350px; right:0;"></div></div>
            <select id="cli-f-sty" class="luxe-btn" onchange="renderCli()"></select>
            <div class="luxe-btn" onclick="addCliTrig()" style="font-size:2.2rem; padding:12px 35px;">+</div>
        </div>
    </div>
    <div class="content-scroll"><div class="client-grid-container" id="cli-list"></div></div>
    <div class="side-nav" id="cli-side-nav"></div>
</div>

<div id="pg-set" class="page">
    <div class="header"><div style="font-size: 2.6rem; font-weight: 900;">設定</div></div>
    <div class="content-scroll" style="padding:0 45px;" id="set-content-container"></div>
</div>

<div id="pg-day" class="page">
    <div class="header"><div style="display:flex; align-items:center; gap:25px;"><i class="fas fa-chevron-left luxe-btn" style="border:none;" onclick="showP('pg-res')"></i><i class="fas fa-chevron-left luxe-btn" onclick="shiftDay(-1)"></i><div id="day-title" style="font-weight:900; font-size:2rem;"></div><i class="fas fa-chevron-right luxe-btn" onclick="shiftDay(1)"></i></div><div class="luxe-btn" onclick="goToday()">今天</div></div>
    <div class="lane-container" id="day-lanes"></div>
</div>

<button class="fab" onclick="popBooking()"><i class="fas fa-plus"></i></button>

<div class="nav">
    <div onclick="showP('pg-res')" id="n-res" class="nav-item active"><i class="fas fa-calendar-alt"></i><br><span style="font-size:1rem; font-weight:900;">預約表</span></div>
    <div onclick="showP('pg-cli')" id="n-cli" class="nav-item"><i class="fas fa-user-circle"></i><br><span style="font-size:1rem; font-weight:900;">顧客</span></div>
    <div onclick="showP('pg-set')" id="n-set" class="nav-item"><i class="fas fa-sliders-h"></i><br><span style="font-size:1rem; font-weight:900;">設定</span></div>
</div>

<script>
    let curD = new Date();
    let tempTags = [];
    let cliKw = "";
    let store = JSON.parse(localStorage.getItem('SALON_MASTER_FINAL_LOCK_V307')) || {
        startH: "11:00", endH: "19:00", offColor: "#e5e5ea", 
        stylists: [{id: 1, name: 'Tonny', color: '#1d1d1f'}, {id: 2, name: 'Apple', color: '#D4AF37'}],
        tags: [{id: 1, name: '剪髮'}, {id: 2, name: '洗髮'}], appointments: [], clients: [], offDays: []
    };

    function saveS() { localStorage.setItem('SALON_MASTER_FINAL_LOCK_V307', JSON.stringify(store)); }

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id.includes('res')) initMonth();
        else if(id==='pg-cli') renderCli();
        else if(id==='pg-set') renderSet();
        else if(id==='pg-day') renderDay(curD.toLocaleDateString('sv'));
    }

    function goToday() { curD = new Date(); renderDay(curD.toLocaleDateString('sv')); showP('pg-day'); }
    function shiftDay(v) { curD.setDate(curD.getDate() + v); renderDay(curD.toLocaleDateString('sv')); }

    // --- 鎖死細節：空白處關閉建議清單 ---
    window.addEventListener('click', e => {
        document.querySelectorAll('.suggest-box').forEach(box => {
            if (!e.target.closest('input') && !e.target.closest('.suggest-box')) box.style.display = 'none';
        });
    });

    function searchStored(el, boxId) {
        const val = el.value.trim(); const box = document.getElementById(boxId);
        if(!val) { box.style.display='none'; return; }
        const ms = store.clients.filter(c => (c.n||c.name||"").includes(val) || (c.p||c.phone||"").includes(val));
        if(ms.length) { box.style.display='block'; box.innerHTML = ms.map(m => `<div class="suggest-item" onclick="pickSug('${m.n||m.name}', '${m.p||m.phone}', '${m.lastSty}', '${boxId}')">${m.n||m.name} (${m.p||m.phone})</div>`).join(''); } else box.style.display='none';
    }

    function pickSug(n, p, s, boxId) {
        if(boxId === 'sw-box' || boxId === 'cli-sw-box') { cliKw = n; renderCli(); Swal.close(); }
        else { document.getElementById('pop-n').value=n; document.getElementById('pop-p').value=p; document.getElementById('pop-s').value=s; document.getElementById('pop-box').style.display='none'; }
    }

    async function popCliSearch() {
        await Swal.fire({ title: '搜尋', html: `<input id="sw-search" class="luxe-btn" style="width:100%;" oninput="searchStored(this, 'sw-box')"><div id="sw-box" class="suggest-box"></div>`, showConfirmButton: false });
    }

    // --- 快捷標籤同步備忘錄 (關鍵修正 1) ---
    function togglePay(id, code, emoji, labelName, ds) {
        const a = store.appointments.find(x => String(x.id) === String(id));
        if(!a) return;
        if(!a.payTags) a.payTags = [];
        
        const idx = a.payTags.indexOf(code);
        let currentNote = a.note_full || "";
        const tagText = `${emoji}${labelName}`;

        if(idx > -1) {
            a.payTags.splice(idx, 1);
            a.note_full = currentNote.replace(tagText, "").trim();
        } else {
            a.payTags.push(code);
            a.note_full = (currentNote + " " + tagText).trim();
        }
        saveS(); renderDay(ds);
    }

    function renderDay(ds) {
        const days = ['日','一','二','三','四','五','六'];
        document.getElementById('day-title').innerText = `${ds} (週${days[new Date(ds).getDay()]})`; 
        const area = document.getElementById('day-lanes'); area.innerHTML = '';
        const start = parseInt(store.startH || '11'); const end = parseInt(store.endH || '19');
        const hours = []; for(let i=start; i<=end; i++) hours.push(`${i}:00`);

        store.stylists.forEach(s => {
            const lane = document.createElement('div'); lane.className = 'lane';
            lane.innerHTML = `<div style="text-align:center; font-weight:900; color:${s.color}; font-size:1.8rem; margin-bottom:20px;">${s.name}</div>`;
            hours.forEach(t => {
                const row = document.createElement('div'); row.className = 'time-row-space'; row.style.position = "relative";
                const matched = store.appointments.filter(a => a.date === ds && a.time.split(':')[0] === t.split(':')[0] && String(a.styId) === String(s.id));
                const label = `<div style="position:absolute; left:-45px; top:12px; font-size:0.75rem; color:#bbb; font-weight:900;">${t}</div>`;
                if(matched.length) {
                    row.innerHTML = label + matched.map(a => {
                        const tagHtml = `<div class="tag-group">
                            <span class="tag-pill ${a.payTags?.includes('L')?'active-L':''}" onclick="event.stopPropagation(); togglePay('${a.id}','L','🟢','Line','${ds}')">Line</span>
                            <span class="tag-pill ${a.payTags?.includes('J')?'active-J':''}" onclick="event.stopPropagation(); togglePay('${a.id}','J','🧧','街口','${ds}')">街口</span>
                            <span class="tag-pill ${a.payTags?.includes('C')?'active-C':''}" onclick="event.stopPropagation(); togglePay('${a.id}','C','💰','現金','${ds}')">現</span>
                            <span class="tag-pill ${a.payTags?.includes('P')?'active-P':''}" onclick="event.stopPropagation(); togglePay('${a.id}','P','🔹','支付','${ds}')">支</span>
                            <span class="tag-pill ${a.payTags?.includes('S')?'active-S':''}" onclick="event.stopPropagation(); togglePay('${a.id}','S','📦','販賣','${ds}')">販</span>
                        </div>`;
                        return `<div class="apt-card ${a.done?'completed':''}" style="--c:${s.color}; margin-left:15px; width:calc(100% - 20px); padding:20px;">
                            ${tagHtml}
                            <div style="position:absolute; right:15px; top:15px; display:flex; gap:12px; align-items:center;">
                                <i class="fas fa-pen" style="color:#ccc; cursor:pointer;" onclick="event.stopPropagation(); popBooking('${a.n||a.name}','${a.p||a.phone}','${a.styId}','${a.id}')"></i>
                                <i class="fas fa-trash-alt" style="color:rgba(255,0,0,0.2); cursor:pointer;" onclick="event.stopPropagation(); confirmDelApt('${a.id}','${ds}')"></i>
                                <i class="fas fa-check-circle" style="color:${a.done?'var(--gold)':'#eee'}; font-size:1.6rem; cursor:pointer;" onclick="event.stopPropagation(); toggleAptDone('${a.id}','${ds}')"></i>
                            </div>
                            <div style="font-weight:900; color:var(--gold); font-size:1.1rem;">${a.time} <span style="font-weight:normal; color:#888;">👤 ${a.c||""}人 📞 ${a.p||a.phone}</span></div>
                            <div style="font-weight:900; font-size:1.8rem; margin:5px 0;">${a.n || a.name}</div>
                            <div style="background:rgba(212,175,55,0.05); padding:10px; border-radius:15px; border-left:3px solid var(--gold); font-weight:900; color:var(--gold);">✂️ ${(a.tags || []).join('+') || '服務'}</div>
                            <div style="font-size:0.85rem; color:#666; margin-top:8px;">${a.note_full || "無備註"}</div>
                        </div>`;
                    }).join('');
                } else row.innerHTML = label + `<div style="flex:1; height:40px; margin-left:15px;"></div>`;
                lane.appendChild(row);
            }); area.appendChild(lane);
        });
    }

    // --- 人數空白手打 (關鍵修正 2) ---
    async function popBooking(n="", p="", sId=null, editId=null) {
        const apt = editId ? store.appointments.find(a => String(a.id) === String(editId)) : null;
        tempTags = apt ? [...(apt.tags || [])] : [];
        const { value: res } = await Swal.fire({
            title: '預約', customClass: { popup: 'swal-pill' }, width: '85%',
            html: `<div style="position:relative; margin-bottom:15px;"><input id="pop-n" class="luxe-btn" style="width:100%; font-size:1.5rem;" value="${n}" placeholder="姓名" oninput="searchStored(this, 'pop-box')"><div id="pop-box" class="suggest-box"></div></div>
                <input id="pop-p" class="luxe-btn" style="width:100%; margin-bottom:15px;" value="${p}" placeholder="電話號碼">
                <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center;">
                    <select id="pop-s" class="luxe-btn" style="flex:1.5; font-size:1rem;">${store.stylists.map(s=>`<option value="${s.id}" ${String(s.id)===String(sId||1)?'selected':''}>${s.name}</option>`).join('')}</select>
                    <div style="flex:1; display:flex; align-items:center;"><span style="font-weight:900; margin-right:5px;">人數</span><input id="pop-c" class="luxe-btn" style="width:100%; text-align:center;" type="text" value="${apt?apt.c||apt.count:''}"></div>
                </div>
                <textarea id="pop-note" class="luxe-btn" style="width:100%; height:80px; border-radius:20px; margin-bottom:15px;" placeholder="備忘錄...">${apt?apt.note_full||apt.note:""}</textarea>
                <div class="drawer-btn" onclick="const c=document.getElementById('pop-tg-drawer'); c.style.display=c.style.display==='block'?'none':'block';"><span>項目</span><i class="fas fa-chevron-down"></i></div>
                <div id="pop-tg-drawer" class="drawer-content">${store.tags.map(t=>`<div class="tag-chip ${tempTags.includes(t.name)?'selected':''}" onclick="this.classList.toggle('selected'); const i=tempTags.indexOf('${t.name}'); if(i>-1) tempTags.splice(i,1); else tempTags.push('${t.name}')">${t.name}</div>`).join('')}</div>
                <div style="display:flex; gap:10px;"><input id="pop-d" class="luxe-btn" type="date" style="flex:1.5;" value="${apt?apt.date:curD.toLocaleDateString('sv')}"><input id="pop-t" class="luxe-btn" type="time" style="flex:1;" value="${apt?apt.time:'12:00'}"></div>`,
            preConfirm: () => ({ n: document.getElementById('pop-n').value, p: document.getElementById('pop-p').value, styId: document.getElementById('pop-s').value, c: document.getElementById('pop-c').value, note: document.getElementById('pop-note').value, d: document.getElementById('pop-d').value, t: document.getElementById('pop-t').value })
        });
        if (res && res.n) {
            const data = { id: editId || String(Date.now()), n: res.n, name: res.n, p: res.p, phone: res.p, styId: res.styId, c: res.c, count: res.c, note_full: res.note, date: res.d, time: res.t, tags: [...tempTags], done: apt?apt.done:false, payTags: apt?apt.payTags:[] };
            if (editId) store.appointments = store.appointments.map(a => String(a.id) === String(editId) ? data : a);
            else { store.appointments.push(data); if(!store.clients.find(c => (c.n||c.name) === res.n)) store.clients.push({ n: res.n, name: res.n, p: res.p, phone: res.p, lastSty: res.styId, bm: '', bd: '', note: '' }); }
            saveS(); initMonth(); renderDay(res.d);
        }
    }

    // --- 顧客頁面：神還原雙排卡片、歷史紀錄、備註、筆、垃圾桶 ---
    function renderCli() {
        const area = document.getElementById('cli-list'); const fStyId = document.getElementById('cli-f-sty').value;
        area.innerHTML = store.clients.filter(c => (c.n||c.name||"").includes(cliKw) && (fStyId==="" || String(c.lastSty)===fStyId)).map(c => {
            const sty = store.stylists.find(s => String(s.id) === String(c.lastSty));
            const history = store.appointments.filter(a => (a.n||a.name) === (c.n||c.name) && a.done).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);
            return `<div id="cli-card-${c.n}" class="apt-card" style="margin-bottom:25px; border-left:12px solid ${sty?.color||'#eee'}; padding:30px; border-radius:40px;">
                <div style="position:absolute; right:20px; top:20px; color:${sty?.color}; border:1px solid ${sty?.color}; padding:4px 12px; border-radius:15px; font-size:0.8rem; font-weight:900;">${sty?.name || '未指定'}</div>
                <div style="font-weight:900; font-size:2.2rem; margin-bottom:5px;">${c.n||c.name}</div>
                <div style="display:flex; gap:25px; font-size:1.1rem; color:#666; margin-bottom:10px;"><div>📞 ${c.p||c.phone||"未設定"}</div><div>🎂 ${c.bm||""}/${c.bd||""}</div></div>
                <div style="font-size:1.1rem; color:var(--gold); font-weight:700; margin-bottom:12px;">「${c.note || '新顧客'}」</div>
                <div style="background:#fcfcfd; padding:20px; border-radius:25px; border:1px solid #f0f0f0;">
                    <div style="font-size:0.8rem; font-weight:900; color:#bbb; margin-bottom:10px;">最近紀錄</div>
                    ${history.length ? history.map(h => `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="font-weight:900;">${h.date}</span><span style="color:var(--gold); font-weight:700;">${(h.tags||[]).join('+')}</span></div>`).join('') : '尚無紀錄'}
                </div>
                <div style="display:flex; justify-content:flex-end; gap:25px; margin-top:20px;">
                    <i class="fas fa-sticky-note" style="color:#ccc; font-size:1.5rem; cursor:pointer;" onclick="editCliNote('${c.n||c.name}')"></i>
                    <i class="fas fa-pen" style="color:#ccc; font-size:1.2rem; cursor:pointer;" onclick="editCli('${c.n||c.name}')"></i>
                    <i class="fas fa-calendar-plus" style="color:var(--gold); font-size:2.2rem; cursor:pointer;" onclick="popBooking('${c.n||c.name}','${c.p||c.phone}','${c.lastSty}')"></i>
                    <i class="fas fa-trash-alt" style="color:rgba(255,0,0,0.1); font-size:1.2rem; cursor:pointer;" onclick="confirmDelCli('${c.n||c.name}')"></i>
                </div>
            </div>`;
        }).join('');
        const sideNav = document.getElementById('cli-side-nav'); if (sideNav) {
            const initials = [...new Set(store.clients.map(c => (c.n||"")[0]))].sort();
            sideNav.innerHTML = initials.map(char => `<div class="side-nav-item" onclick="scrollToChar('${char}')">${char}</div>`).join('');
        }
    }

    // --- 生日手動空白手打 (關鍵修正 2) ---
    async function addCliTrig() {
        const { value: r } = await Swal.fire({ title: '新增顧客', html: `<input id="cn" class="luxe-btn" style="width:100%;margin-bottom:15px;" placeholder="姓名"><input id="cp" class="luxe-btn" style="width:100%;margin-bottom:15px;" placeholder="電話"><select id="cs" class="luxe-btn" style="width:100%;">${store.stylists.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><div style="display:flex; gap:10px; justify-content:center; align-items:center; margin-top:15px;">🎂 生日 <input id="cm" class="luxe-btn" style="width:65px;" type="text" placeholder="月"> / <input id="cd" class="luxe-btn" style="width:65px;" type="text" placeholder="日"></div>`, preConfirm: () => ({ n: document.getElementById('cn').value, p: document.getElementById('cp').value, s: document.getElementById('cs').value, m: document.getElementById('cm').value, d: document.getElementById('cd').value }) });
        if (r && r.n) { store.clients.push({ n: r.n, name: r.n, p: r.p, phone: r.p, lastSty: r.s, bm: r.m, bd: r.d, note: '' }); saveS(); renderCli(); }
    }

    async function editCli(oldN) {
        const c = store.clients.find(x => (x.n||x.name) === oldN);
        const { value: r } = await Swal.fire({ title: '修改資料', html: `<input id="en" class="luxe-btn" style="width:100%;margin-bottom:15px;" value="${c.n||c.name}"><input id="ep" class="luxe-btn" style="width:100%;margin-bottom:15px;" value="${c.p||c.phone}"><select id="es" class="luxe-btn" style="width:100%;">${store.stylists.map(s=>`<option value="${s.id}" ${String(s.id)===String(c.lastSty)?'selected':''}>${s.name}</option>`).join('')}</select><div style="display:flex; gap:10px; justify-content:center; align-items:center; margin-top:15px;">🎂 <input id="em" class="luxe-btn" style="width:65px;" value="${c.bm}" type="text"> / <input id="ed" class="luxe-btn" style="width:65px;" value="${c.bd}" type="text"></div>`, preConfirm: () => ({ n: document.getElementById('en').value, p: document.getElementById('ep').value, s: document.getElementById('es').value, m: document.getElementById('em').value, d: document.getElementById('ed').value }) });
        if (r) { c.n = r.n; c.name = r.n; c.p = r.p; c.phone = r.p; c.lastSty = r.s; c.bm = r.m; c.bd = r.d; saveS(); renderCli(); }
    }

    // --- 設定頁面：神還原圓點選色、修改筆、刪除 X ---
    function renderSet() {
        const container = document.getElementById('set-content-container');
        container.innerHTML = `
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">0. 營業時間</p><div style="display:flex; gap:25px;"><input type="time" class="luxe-btn" style="flex:1;" value="${store.startH}" onchange="store.startH=this.value;saveS();">至<input type="time" class="luxe-btn" style="flex:1;" value="${store.endH}" onchange="store.endH=this.value;saveS();"></div></div>
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">1. 排休設定</p><div style="display:flex; align-items:center; gap:20px;"><div class="luxe-btn" onclick="pickOffMulti()" style="flex:1;">選擇月份與日期</div><div onclick="pickLuxeColor('off')" style="width:65px; height:65px; border-radius:50%; background:${store.offColor}; border:4px solid #fff; cursor:pointer;"></div></div></div>
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">2. 人員管理</p>${store.stylists.map(s => `<div class="luxe-btn" style="width:100%; margin-bottom:15px; justify-content:space-between;"><div style="display:flex; align-items:center; gap:20px;"><div onclick="pickLuxeColor('sty', ${s.id})" style="width:40px; height:40px; border-radius:50%; background:${s.color}; border:3.5px solid #fff; cursor:pointer;"></div><span>${s.name}</span></div><div style="display:flex; gap:15px;"><i class="fas fa-pen" onclick="editStyTrig(${s.id},'${s.name}')"></i><i class="fas fa-times" style="color:#ff4d4d;" onclick="confirmDelSty(${s.id})"></i></div></div>`).join('')}<div class="luxe-btn" style="width:100%; border:1px dashed var(--gold); background:transparent; color:var(--gold);" onclick="addStyTrig()">+ 新增人員</div></div>
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">3. 項目管理</p><div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px;">${store.tags.map(t => `<div class="luxe-btn" style="height:auto; padding:10px 25px; border-radius:30px;"><span>${t.name}</span><div style="margin-left:15px; display:flex; gap:12px;"><i class="fas fa-pen" onclick="editTagTrig(${t.id},'${t.name}')"></i><i class="fas fa-times" style="color:#ff4d4d;" onclick="confirmDelTag(${t.id})"></i></div></div>`).join('')}</div><div class="luxe-btn" style="width:100%; border:1px dashed var(--gold); background:transparent; color:var(--gold);" onclick="addTagTrig()">+ 新增項目</div></div>
            <div style="margin-bottom:60px;"><p style="font-weight:900; color:#888;">4. 數據備份</p><div style="display:flex; gap:25px;"><div class="luxe-btn" style="flex:1;" onclick="exportToFile()">下載存檔</div><div class="luxe-btn" style="flex:1;" onclick="triggerLoad()">讀取存檔</div></div></div>
        `;
    }

    // --- 輔助功能鎖死 ---
    function confirmDelApt(id, ds) { Swal.fire({ title: '確定刪除？', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' }).then(res => { if(res.isConfirmed) { store.appointments = store.appointments.filter(a => String(a.id) !== String(id)); saveS(); renderDay(ds); }}); }
    function confirmDelSty(id) { Swal.fire({ title: '移除人員？', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' }).then(res => { if(res.isConfirmed) { store.stylists = store.stylists.filter(s => s.id !== id); saveS(); renderSet(); }}); }
    function confirmDelTag(id) { Swal.fire({ title: '移除項目？', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' }).then(res => { if(res.isConfirmed) { store.tags = store.tags.filter(t => t.id !== id); saveS(); renderSet(); }}); }
    function confirmDelCli(n) { Swal.fire({ title: '刪除顧客？', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' }).then(res => { if(res.isConfirmed) { store.clients = store.clients.filter(x => (x.n||x.name) !== n); saveS(); renderCli(); }}); }
    async function pickLuxeColor(type, id = null) { const cur = type === 'off' ? store.offColor : store.stylists.find(x => x.id == id).color; const { value: res } = await Swal.fire({ title: '選色', html: `<input type="color" id="sw-c" value="${cur}" style="width:150px; height:150px;">`, showCancelButton: true, preConfirm: () => document.getElementById('sw-c').value }); if (res) { if(type === 'off') store.offColor = res; else store.stylists.find(x => x.id == id).color = res; saveS(); renderSet(); initMonth(); } }
    async function pickOffMulti() { const { value: month } = await Swal.fire({ title: '選擇月份', input: 'month', showCancelButton: true }); if (!month) return; await Swal.fire({ title: `${month} 排休設定`, html: '<div id="sw-cal" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;"></div>', didOpen: () => { const g = document.getElementById('sw-cal'); const pick = new Date(month + "-01"); const year = pick.getFullYear(), m = pick.getMonth(); const days = new Date(year, m+1, 0).getDate(); for(let d=1; d<=days; d++) { const ds = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const el = document.createElement('div'); el.innerText = d; el.style.padding = "10px"; el.style.background = store.offDays.includes(ds) ? store.offColor : "#fff"; el.style.border = "1px solid #eee"; el.onclick = () => { const i = store.offDays.indexOf(ds); if(i>-1) store.offDays.splice(i,1); else store.offDays.push(ds); saveS(); el.style.background = store.offDays.includes(ds) ? store.offColor : "#fff"; initMonth(); }; g.appendChild(el); } }}); }
    async function editStyTrig(id, old) { const {value:n}=await Swal.fire({title:'更名', input:'text', inputValue:old}); if(n){store.stylists.find(x=>x.id==id).name=n; saveS(); renderSet();} }
    async function editTagTrig(id, old) { const {value:n}=await Swal.fire({title:'修改項目', input:'text', inputValue:old}); if(n){store.tags.find(x=>x.id==id).name=n; saveS(); renderSet();} }
    async function addTagTrig() { const {value:n}=await Swal.fire({title:'項目名稱', input:'text'}); if(n){store.tags.push({id:Date.now(), name:n}); saveS(); renderSet();} }
    async function addStyTrig() { const {value:n}=await Swal.fire({title:'姓名', input:'text'}); if(n){store.stylists.push({id:Date.now(), name:n, color:'#D4AF37'}); saveS(); renderSet();} }
    async function editCliNote(n) { const c=store.clients.find(x=>(x.n||x.name)===n); const {value:t}=await Swal.fire({title:'備忘錄', input:'textarea', inputValue:c.note||''}); if(t!==undefined){c.note=t;saveS();renderCli();} }
    function toggleAptDone(id, ds) { const a = store.appointments.find(x => String(x.id) === String(id)); if(a) { a.done = !a.done; saveS(); renderDay(ds); } }
    function exportToFile() { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(store)],{type:'application/json'})); a.download=`backup.json`; a.click(); }
    function triggerLoad() { const i=document.createElement('input'); i.type='file'; i.onchange=e=>{const r=new FileReader(); r.onload=()=>{ store=JSON.parse(r.result); saveS(); location.reload(); }; r.readAsText(e.target.files[0]); }; i.click(); }
    function initMonth() { const grid = document.getElementById('cal-grid'); grid.innerHTML = ''; const pick = document.getElementById('m-picker').value ? new Date(document.getElementById('m-picker').value + "-01") : new Date(); const year = pick.getFullYear(), month = pick.getMonth(), today = new Date().toLocaleDateString('sv'); const days = new Date(year, month + 1, 0).getDate(); let sDay = new Date(year, month, 1).getDay(); sDay = sDay === 0 ? 6 : sDay - 1; for(let i=0; i<sDay; i++) grid.appendChild(document.createElement('div')); for(let d=1; d<=days; d++) { const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const el = document.createElement('div'); el.className = 'cal-day'; if(ds === today) el.classList.add('today-highlight'); if(store.offDays.includes(ds)) el.style.background = store.offColor; const dots = [...new Set(store.appointments.filter(a => a.date === ds).map(a => store.stylists.find(st => st.id == a.styId)?.color || '#ddd'))].map(c => `<div style="width:12px;height:12px;border-radius:50%;background:${c};display:inline-block;margin:3px;"></div>`).join(''); el.innerHTML = `<div>${d}</div><div style="margin-top:10px;">${dots}</div>`; el.onclick = () => { curD = new Date(ds); showP('pg-day'); }; grid.appendChild(el); } }
    function scrollToChar(char) { const firstMatch = store.clients.find(c => (c.n||"").startsWith(char)); if (firstMatch) { const target = document.getElementById(`cli-card-${firstMatch.n||firstMatch.name}`); if (target) { target.scrollIntoView({ behavior: 'auto', block: 'start' }); target.style.background = "rgba(212, 175, 55, 0.2)"; setTimeout(() => target.style.background = "#fff", 800); } } }
    
    const fillStySelect = () => { const sel = document.getElementById('cli-f-sty'); if(sel) sel.innerHTML = '<option value="">所有設計師</option>' + store.stylists.map(s => `<option value="${s.id}">${s.name}</option>`).join(''); };
    document.getElementById('m-picker').value = new Date().toISOString().slice(0,7);
    fillStySelect(); initMonth(); renderCli(); renderSet();
</script>
</body>
</html>
