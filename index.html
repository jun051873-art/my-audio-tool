<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專屬 1 號 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #f2f2f7; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: #fff; color: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 極簡 Header */
        .header { padding: 60px 40px 20px; display: flex; justify-content: space-between; align-items: flex-end; background: var(--glass); backdrop-filter: blur(20px); border-bottom: 0.5px solid #eee; z-index: 100; }
        .header h1 { font-size: 2.2rem; font-weight: 800; margin: 0; letter-spacing: -1px; }

        .btn-luxe { background: #fff; border: 1px solid var(--gold); border-radius: 30px; padding: 8px 20px; font-weight: 600; cursor: pointer; }
        .btn-luxe:active { background: var(--bg); }

        .content { flex: 1; overflow-y: auto; padding-bottom: 120px; }

        /* 月曆架構 */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); margin: 20px 40px; border: 1px solid var(--gold); border-radius: 20px; overflow: hidden; }
        .cal-day { min-height: 110px; padding: 15px; border: 0.5px solid #f2f2f7; cursor: pointer; position: relative; }
        .cal-day:active { background: #fafafa; }
        .day-num { font-size: 1.4rem; font-weight: 700; }

        /* 顧客卡片 */
        .cli-card { margin: 0 40px 20px; padding: 25px; border-radius: 25px; border: 1px solid #eee; border-left: 10px solid var(--gold); background: #fff; position: relative; }
        .cli-name { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }

        /* 下導航 */
        .nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60%; height: 75px; background: var(--glass); backdrop-filter: blur(20px); border-radius: 40px; border: 1px solid var(--gold); display: flex; justify-content: space-around; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; font-size: 0.8rem; }
        .nav-item.active { color: var(--gold); font-weight: 800; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }

        /* 浮動按鈕 */
        .fab { position: fixed; bottom: 120px; right: 40px; width: 70px; height: 70px; background: #fff; border: 1.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2rem; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; z-index: 99; }

        .page { display: none; width: 100%; height: 100%; flex-direction: column; }
        .page.active { display: flex; }

        .pop-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--gold); border-radius: 12px; font-size: 1rem; }
    </style>
</head>
<body>

<div id="p-res" class="page active">
    <div class="header"><h1>預約表</h1><button class="btn-luxe" onclick="goToday()">今天</button></div>
    <div class="content">
        <div id="cal-grid" class="cal-grid"></div>
    </div>
</div>

<div id="p-cli" class="page">
    <div class="header"><h1>顧客資料</h1><button class="btn-luxe" onclick="popAddCli()">+</button></div>
    <div class="content" id="cli-list"></div>
</div>

<div id="p-set" class="page">
    <div class="header"><h1>設定</h1></div>
    <div class="content" style="padding: 40px;">
        <h3>設計師管理</h3><div id="sty-list"></div><button class="btn-luxe" onclick="addSty()">+ 新增</button>
        <hr style="margin: 30px 0; opacity: 0.2;">
        <h3>項目管理</h3><div id="tag-list" style="display:flex; flex-wrap:wrap; gap:10px;"></div><button class="btn-luxe" onclick="addTag()">+ 新增</button>
    </div>
</div>

<div id="p-day" class="page">
    <div class="header"><div style="display:flex; align-items:center; gap:15px;"><i class="fas fa-chevron-left" onclick="showPage('p-res')"></i><h1 id="day-title">日期</h1></div></div>
    <div class="content" id="day-content" style="padding:20px 40px;"></div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="showPage('p-res')" id="n-res"><i class="fas fa-calendar-alt"></i><div>預約表</div></div>
    <div class="nav-item" onclick="showPage('p-cli')" id="n-cli"><i class="fas fa-users"></i><div>顧客</div></div>
    <div class="nav-item" onclick="showPage('p-set')" id="n-set"><i class="fas fa-cog"></i><div>設定</div></div>
</div>

<div class="fab" id="main-fab" onclick="popApt()">+</div>

<script>
    // 1. 數據初始化 (確保絕對能動)
    let store = JSON.parse(localStorage.getItem('SALON_1_FINAL')) || {
        stylists: [{id: 1, name: '設計師A', color: '#000'}],
        tags: ['剪髮', '洗髮'],
        appointments: [],
        clients: []
    };
    const save = () => localStorage.setItem('SALON_1_FINAL', JSON.stringify(store));

    // 2. 頁面切換引擎
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('n-' + id.split('-')[1]).classList.add('active');
        if(id === 'p-res') renderCal();
        if(id === 'p-cli') renderCli();
        if(id === 'p-set') renderSet();
    }

    // 3. 預約表渲染
    function renderCal() {
        const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const div = document.createElement('div'); div.className = 'cal-day';
            div.innerHTML = `<div class="day-num">${d}</div>`;
            const count = store.appointments.filter(a => a.date === dateStr).length;
            if(count > 0) div.innerHTML += `<div style="margin-top:10px; color:var(--gold); font-weight:800;">● ${count} 筆</div>`;
            div.onclick = () => { viewDay(dateStr); };
            grid.appendChild(div);
        }
    }

    // 4. 單日預約查看
    function viewDay(ds) {
        document.getElementById('day-title').innerText = ds;
        const area = document.getElementById('day-content'); area.innerHTML = '';
        const list = store.appointments.filter(a => a.date === ds);
        if(list.length === 0) area.innerHTML = '<p style="color:#ccc;">今日尚無預約</p>';
        list.forEach(a => {
            area.innerHTML += `<div class="cli-card" style="margin:0 0 15px 0;">
                <div style="font-weight:800; color:var(--gold);">${a.time}</div>
                <div class="cli-name">${a.name}</div>
                <div>${a.tag} | ${a.note}</div>
                <button class="btn-luxe" style="margin-top:10px; color:red; border-color:red;" onclick="delApt(${a.id},'${ds}')">刪除</button>
            </div>`;
        });
        showPage('p-day');
    }

    // 5. 顧客資料渲染
    function renderCli() {
        const area = document.getElementById('cli-list'); area.innerHTML = '';
        store.clients.forEach(c => {
            const history = store.appointments.filter(a => a.name === c.name).slice(-2);
            area.innerHTML += `<div class="cli-card">
                <div class="cli-name">${c.name}</div>
                <div style="color:#666;">📞 ${c.phone}</div>
                <div style="margin-top:10px; font-size:0.85rem; color:#aaa;">歷史紀錄：${history.map(h => h.date).join(', ') || '無'}</div>
                <div style="margin-top:10px; display:flex; gap:10px;">
                    <button class="btn-luxe" onclick="popApt('${c.name}','${c.phone}')">預約</button>
                    <button class="btn-luxe" style="color:red; border-color:red;" onclick="delCli('${c.name}')">刪除</button>
                </div>
            </div>`;
        });
    }

    // 6. 設定頁面
    function renderSet() {
        document.getElementById('sty-list').innerHTML = store.stylists.map(s => `<p>${s.name} <span style="color:red" onclick="delSty(${s.id})"> [刪除]</span></p>`).join('');
        document.getElementById('tag-list').innerHTML = store.tags.map(t => `<div class="btn-luxe">${t} <i class="fas fa-times" onclick="delTag('${t}')"></i></div>`).join('');
    }

    // 7. 功能對話框
    async function popApt(n="", p="") {
        const { value: form } = await Swal.fire({
            title: '新增預約',
            html: `<input id="sw-n" class="pop-input" placeholder="姓名" value="${n}">
                   <input id="sw-p" class="pop-input" placeholder="電話" value="${p}">
                   <input id="sw-d" type="date" class="pop-input" value="${new Date().toISOString().split('T')[0]}">
                   <input id="sw-t" type="time" class="pop-input" value="12:00">
                   <select id="sw-tg" class="pop-input">${store.tags.map(t=>`<option>${t}</option>`).join('')}</select>
                   <input id="sw-nt" class="pop-input" placeholder="備註">`,
            preConfirm: () => ({ name: document.getElementById('sw-n').value, phone: document.getElementById('sw-p').value, date: document.getElementById('sw-d').value, time: document.getElementById('sw-t').value, tag: document.getElementById('sw-tg').value, note: document.getElementById('sw-nt').value })
        });
        if(form && form.name) {
            store.appointments.push({ ...form, id: Date.now() });
            if(!store.clients.find(c => c.name === form.name)) store.clients.push({ name: form.name, phone: form.phone });
            save(); renderCal(); Swal.fire('預約成功');
        }
    }

    async function popAddCli() {
        const { value: r } = await Swal.fire({
            title: '新增顧客',
            html: `<input id="cn" class="pop-input" placeholder="姓名"><input id="cp" class="pop-input" placeholder="電話">`,
            preConfirm: () => ({ name: document.getElementById('cn').value, phone: document.getElementById('cp').value })
        });
        if(r && r.name) { store.clients.push(r); save(); renderCli(); }
    }

    // 8. 刪除邏輯
    function delApt(id, ds) { store.appointments = store.appointments.filter(a => a.id !== id); save(); viewDay(ds); }
    function delCli(n) { store.clients = store.clients.filter(c => c.name !== n); save(); renderCli(); }
    function addSty() { const n = prompt('設計師姓名'); if(n){ store.stylists.push({id:Date.now(), name:n}); save(); renderSet(); } }
    function delSty(id) { store.stylists = store.stylists.filter(s => s.id !== id); save(); renderSet(); }
    function addTag() { const t = prompt('項目名稱'); if(t){ store.tags.push(t); save(); renderSet(); } }
    function delTag(t) { store.tags = store.tags.filter(x => x !== t); save(); renderSet(); }

    function goToday() { const d = new Date().toISOString().split('T')[0]; viewDay(d); }

    // 初始化啟動
    renderCal();
</script>
</body>
</html>
